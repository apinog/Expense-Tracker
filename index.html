<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis gastos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1F44'/%3E%3Cpath d='M14 44l12-14 10 8 14-18' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F44; --blue:#0057A8; --sky:#7FB4EA; --tint:#EAF1FA;
  --bg:#FAFBFC; --panel:#FFFFFF; --ink:#14181F; --ink2:#454C59; --mute:#757D8A; --line:#E1E5EC;
  --ok:#00796B; --warn:#B7791F; --bad:#B3261E; --gold:#B7791F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sabx:max(0px,calc(var(--sab) - var(--gap,0px)));
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D1117; --panel:#151A23; --ink:#EEF1F6; --ink2:#B7BDC9; --mute:#8993A3; --line:#252C38; --tint:#16233B; --blue:#4C9BEA; --ok:#2FB59F; --warn:#E0A53B; --bad:#F2706A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.in{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums lining-nums}

/* barra superior */
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 0}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:600 17px var(--serif);letter-spacing:.2px}
.tright{display:flex;align-items:center;gap:8px}
.fxchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px}
.fxchip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--blue);color:#fff}
.seg.mini{background:rgba(255,255,255,.12)}
.seg.mini button{color:#fff;padding:4px 11px;font-size:13px}
.seg.mini button.on{background:#fff;color:var(--navy)}
.mrow{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.mnav{width:44px;height:40px;border:0;background:transparent;color:#fff;font-size:26px;line-height:1}
.msel{flex:1;appearance:none;-webkit-appearance:none;background:transparent;border:0;color:#fff;font:600 16px var(--serif);text-align:center;text-align-last:center;padding:8px 0}
.msel option{color:#000}

/* contenido */
#view{padding-bottom:calc(96px + var(--sab))}
.hero{background:var(--navy);color:#fff;padding:6px 16px 20px}
.hero .lbl{color:#B9C6DD;font-size:13px}
.hero .big{font:500 44px/1.05 var(--serif);margin:4px 0 4px}
.hero .bar{background:rgba(255,255,255,.18)}
.hero .bar .pace{background:#fff;opacity:.95}
.hstats{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.hstats div{flex:1;min-width:0}
.hstats div+div{border-left:1px solid rgba(255,255,255,.16);padding-left:12px}
.hstats small{display:block;color:#B9C6DD;font-size:11.5px}
.hstats b{font:500 15px var(--serif)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px 12px}
.tile .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .tn{font-size:13.5px;font-weight:500;line-height:1.25;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tile .tt svg{flex:none;margin:-3px -4px 0 0}
.tile .ta{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ta b{color:var(--ink);font-weight:600}
.tile .ts{font-size:12.5px;font-weight:500}
.fixrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.fixrow:last-child{border-bottom:0}
.fixrow .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:#fff}
.fixrow .dot.done{background:var(--ok);border-color:var(--ok)}
.fixrow .nm{flex:1;min-width:0}
.fixrow .nm small{display:block;color:var(--mute);font-size:12px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.shead span{color:var(--mute);font-size:13px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:600 19px/1.2 var(--serif)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'+';font:400 22px var(--sans);color:var(--mute)}
details.fold[open]>summary::after{content:'−'}
details.fold[open]>summary{margin-bottom:10px}
details.more>summary{cursor:pointer;color:var(--blue);font-size:13px;list-style:none;margin:2px 0 8px}
details.more>summary::-webkit-details-marker{display:none}
.hero .sub{color:#D6E0F0;font-size:13px}
.hero .sub b{color:#fff}
.hero .sub b.bad{color:#FFB4AE}
.kpis{display:flex;gap:18px;margin-top:14px}
.kpis div{flex:1}
.kpis small{display:block;color:#B9C6DD;font-size:12px}
.kpis b{font:500 17px var(--serif)}
.sec{padding:18px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.sec:nth-child(even){background:var(--bg)}
.sec h2{font:600 19px/1.2 var(--serif);margin:0 0 4px}
.sec .hint,.sheet .hint{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.link{border:0;background:none;color:var(--blue);padding:0;font-size:13px}

/* barras de progreso con marcador de ritmo */
.bar{position:relative;height:9px;background:var(--line);border-radius:5px;margin:7px 0 2px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.bar.warn>i{background:var(--warn)}
.bar.bad>i{background:var(--bad)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.crow{padding:9px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chead em{font-style:normal;color:var(--mute);font-size:12.5px}
.csub{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.ok{color:var(--ok)} .warnc{color:var(--warn)} .badc{color:var(--bad)}

/* ideas automáticas */
.ins{display:flex;gap:10px;padding:10px 0 10px 12px;border-left:3px solid var(--line);margin-bottom:10px}
.ins.ok{border-color:var(--ok)} .ins.warn{border-color:var(--warn)} .ins.bad{border-color:var(--bad)}
.ins b{display:block;font-weight:600}
.ins span{color:var(--ink2)}

/* tabla */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mute);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{white-space:normal}
.tbl tr.sub td{font-weight:600;background:var(--tint)}
.tbl tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}

/* explorador */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.ctl label{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.ctl .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.chk input{width:auto;margin:0}
.brow2{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.brow2 .nm{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow2 .tr{flex:1;height:14px;background:var(--tint);border-radius:3px;overflow:hidden}
.brow2 .tr i{display:block;height:100%;background:var(--blue);border-radius:3px}
.brow2 .vl{flex:0 0 auto;min-width:62px;text-align:right}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font:11px var(--sans);fill:var(--mute)}
.empty{color:var(--mute);padding:18px 0;text-align:center}

/* gastos */
.srow{display:flex;gap:8px;padding:14px 16px 8px}
.srow input{flex:1.4}
.srow select{flex:1}
.dayh{display:flex;justify-content:space-between;padding:12px 16px 6px;color:var(--mute);font-size:12.5px;background:var(--bg)}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--line);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{color:var(--mute);font-size:12px}
.row .amt{text-align:right;flex:none}
.row .amt b{display:block;font-weight:500}
.row .amt small{color:var(--mute);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;color:#fff;background:var(--c,#7B8794);margin-right:4px}
.rw{color:var(--ok)}
.sumline{padding:4px 16px 8px;color:var(--mute);font-size:12.5px}

/* metas */
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.brow .nm{flex:1;min-width:0}
.brow .nm small{display:block;color:var(--mute);font-size:11.5px}
.brow input{width:104px;text-align:right}
.brow select{width:58px;padding:10px 4px}
.badge{display:inline-block;background:var(--tint);color:var(--blue);border-radius:999px;font-size:11px;padding:0 7px;margin-left:4px}
.kv{display:flex;justify-content:space-between;padding:6px 0}
.kv.t{border-top:1px solid var(--line);font-weight:600;margin-top:4px;padding-top:10px}

/* formularios */
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label.l{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:var(--tint);border-color:transparent;color:var(--blue);width:100%;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}
.prev{background:var(--tint);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.prev .tip{margin-top:6px;color:var(--ink2)}
.prev .tip button{border:0;background:none;color:var(--blue);font-weight:600;padding:0 0 0 6px}

/* hojas */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet h3{font:600 20px var(--serif);margin:0 0 2px}
.grid-r{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center}
.grid-r label{font-size:13px;color:var(--ink2)}

/* navegación inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sabx);z-index:20}
#tabs .in{display:flex}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--mute);background:none;border:0}
#tabs button.on{color:var(--blue);font-weight:600}
#fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + var(--sabx));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;line-height:1;border:0;box-shadow:0 6px 18px rgba(0,87,168,.38);z-index:21}
#fab.hide{display:none}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
/* tarjetas */
.cth{display:inline-block;width:30px;height:19px;border-radius:3px;object-fit:cover;vertical-align:-5px;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08);background:#ccd}
.cth.gen{display:inline-flex;align-items:center;justify-content:center;color:#fff;font:600 8.5px var(--sans);vertical-align:-5px}
.cardimg{width:100%;aspect-ratio:1.586;border-radius:12px;object-fit:cover;display:block;box-shadow:0 8px 20px rgba(11,31,68,.2)}
.cardgen{width:100%;aspect-ratio:1.586;border-radius:12px;flex-direction:column;justify-content:space-between;padding:14px 16px;color:#fff;font:600 18px var(--serif);box-shadow:0 8px 20px rgba(11,31,68,.2)}
.cardgen small{font:500 12px var(--sans);opacity:.85}
.cblock .cardgen{font-size:14px;padding:10px 12px}
.cblock{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cblock:last-child{border-bottom:0}
.cblock h3{font:600 16px var(--sans);margin:0}
.cblock .rules{color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.cblock .kv{padding:3px 0;font-size:13px}
.bankh{font:600 13px var(--sans);color:var(--mute);margin:16px 0 0}
.badge.ok{background:rgba(0,121,107,.12);color:var(--ok)}
.cpick{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.cpick button{flex:none;width:88px;border:2px solid transparent;border-radius:10px;background:none;padding:4px;text-align:center;font-size:11.5px;line-height:1.2;color:var(--ink2);scroll-snap-align:start}
.cpick button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
.cpick .cth{width:76px;height:48px;margin:0 auto 4px;border-radius:6px;display:block;font-size:13px}
.cpick .cth.gen{display:flex}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#fff}
.mi{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;overflow:hidden;flex:none;color:#fff;font:600 9.5px var(--sans);vertical-align:-6px;margin-right:6px;background:#7B8794}
.mi img{width:100%;height:100%;object-fit:cover;background:#fff}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mchips button{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 4px;font-size:13px;color:var(--ink)}
.mchips button.on{border-color:var(--blue);background:var(--tint);font-weight:600}
.qchips{display:flex;gap:6px;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px}
.qchips button{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--ink)}
.banner{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:12px;padding:10px 12px;margin:12px 16px 0}
.banner p{margin:0;flex:1;font-size:13px;color:var(--ink2)}
.banner .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 2px}
.gear{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sugg{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.sugg small{display:block;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== estructura de app: nada se pega ni se corre al navegar ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--panel)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#top{position:relative;top:auto;flex:none;z-index:5}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:0}
#vin{padding-bottom:calc(92px + var(--sab))}
#tabs{position:relative;left:auto;right:auto;bottom:auto;flex:none;z-index:5}
#fab{transition:transform .2s ease,opacity .2s ease}
#fab.away{transform:translateY(96px);opacity:0;pointer-events:none}
body.noscroll #view{overflow:hidden}
.overlay{inset:auto;left:0;right:0;top:0;bottom:auto;height:100%;overscroll-behavior:contain}
.sheet{max-height:calc(100% - var(--sat) - 8px);display:flex;flex-direction:column;overflow:hidden;padding:0}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 18px}
.sbody:last-child{padding-bottom:calc(18px + var(--sabx))}
.sheet>.btns{flex:none;margin:0;padding:10px 16px calc(12px + var(--sabx));background:var(--panel);border-top:1px solid var(--line)}
button,.seg,.tile,.row,.fixrow,.cpick button,.mchips button,.qchips button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ic{position:relative}
.ic img.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;border-radius:10px}
.mi{position:relative}
.badc{color:var(--bad);font-weight:600}
.ic img.via{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;padding:0;border-radius:5px;border:1.5px solid var(--panel);object-fit:cover;background:#fff}
.mi img.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"><div id="vin" class="in"></div></main>
  <nav id="tabs"></nav>
</div>
<button id="fab" aria-label="Agregar">+</button>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<noscript>Esta app necesita JavaScript.</noscript>

<script>
(function(){
'use strict';

/* ================= constantes y datos base ================= */
var KEY='gastos_tracker_v1';

  if(!st.ex.length){

    out.push({tone:over?'warn':'ok',t:'Ritmo del mes',x:'Llevás '+money(st.spent)+'. Con este ritmo cerrarías cerca de '+money(proj)+', '+(over?money(proj-st.budget)+' sobre la meta.':money(st.budget-proj)+' por debajo de la meta.')});
  }else if(m<cur&&st.budget>0){

  }

    .filter(function(o){return o.budget>0&&o.spent/o.budget>=0.85;})
    .sort(function(a,b){return b.spent/b.budget-a.spent/a.budget;}).slice(0,2);

  });

  if(worst&&miss>=crcToDisp(500)){
    var ct=catById(worst.e.cat);
    out.push({tone:'warn',t:'Dejaste '+money(miss)+' sin ganar',x:'La compra con más diferencia fue '+(ct?ct.name.toLowerCase():'una compra')+': usaste '+worst.used.name+' ('+rateText(worst.used,rateFor(worst.used,ct,worst.e.intl))+') y '+worst.best.card.name+' daba '+rateText(worst.best.card,worst.best.rate)+', si el comercio la acepta.'});
  }
  if(m<cur){
    var pm=addMonths(m,-1), pst=monthStats(pm);
    if(pst.varSpent>0&&st.varSpent>0){
      var ch=(st.varSpent/pst.varSpent-1)*100;

    }
  }
  return out.slice(0,5);
}

/* ================= explorador de gráficos ================= */
function fixChart(){
  var c=U().chart;
  if(c.group==='day'&&c.period!=='month') c.group='week';
  var time=['day','week','month'].indexOf(c.group)>=0;
  if(time&&['col','line'].indexOf(c.type)<0) c.type='col';
  if(!time&&['bar','donut'].indexOf(c.type)<0) c.type='bar';
}
function periodRange(){
  var c=U().chart, m=U().month;
  switch(c.period){
    case '3m': return [addMonths(m,-2),m];
    case '6m': return [addMonths(m,-5),m];
    case 'year': return [m.slice(0,4)+'-01',m];
    case 'all':
      var ms=S.expenses.map(mOf).sort();
      return [ms[0]||m,ms[ms.length-1]||m];
    case 'custom':
      var a=c.from||m,b=c.to||m; return a<=b?[a,b]:[b,a];
    default: return [m,m];
  }
}
function groupData(list,rng){
  var c=U().chart, rw=rewards(), eg=c.group;
  function val(e){return c.measure==='reward'?crcToDisp(rw.get(e.id).final,e.rate):vOf(e);}
  var map=new Map();
  function add(k,l,v){var o=map.get(k);if(o){o.value+=v;o.n++;}else map.set(k,{key:k,label:l,value:v,n:1});}
  list.forEach(function(e){
    var v=val(e);
    if(eg==='cat'){var ct=catById(e.cat);add(e.cat,ct?ct.emoji+' '+ct.name:'Sin categoría',v);}
    else if(eg==='card'){var cd=cardById(e.card);add(e.card,cd?cd.name:'—',v);}
    else if(eg==='merchant'){var nm=(e.merchant||'').trim();add(nm.toLowerCase()||'_',nm||'Sin comercio',v);}
    else if(eg==='via'){add(e.via||'_local',e.via||'En el local',v);}
    else if(eg==='day'){var dk=e.date.slice(0,7)===mOf(e)?e.date:mOf(e)+'-01';add(dk,String(+dk.slice(8)),v);}
    else if(eg==='week'){var k=weekStart(e.date);add(k,shortDate(k),v);}
    else{var k2=mOf(e);add(k2,mshort(k2),v);}
  });
  var arr=[],i;
  if(eg==='day'){var n=daysIn(rng[0]);for(i=1;i<=n;i++){var k=rng[0]+'-'+pad(i);arr.push(map.get(k)||{key:k,label:String(i),value:0,n:0});}}
  else if(eg==='week'){var w=weekStart(rng[0]+'-01'),end=rng[1]+'-'+pad(daysIn(rng[1])),guard=0;while(w<=end&&guard++<400){arr.push(map.get(w)||{key:w,label:shortDate(w),value:0,n:0});w=addDays(w,7);}}
  else if(eg==='month'){var mm=rng[0],g2=0;while(mm<=rng[1]&&g2++<400){arr.push(map.get(mm)||{key:mm,label:mshort(mm),value:0,n:0});mm=addMonths(mm,1);}}
  else{
    arr=Array.from(map.values()).sort(function(a,b){return b.value-a.value;});
    if(arr.length>8){var rest=arr.slice(7);arr=arr.slice(0,7);arr.push({key:'_o',label:'Otros',value:rest.reduce(function(a,x){return a+x.value;},0),n:rest.length});}
  }
  return arr;
}
function niceMax(v){
  if(v<=0) return 1;
  var p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p;
  var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;
  return n*p;
}
function drawBars(arr){
  var max=Math.max.apply(null,arr.map(function(a){return a.value;}).concat([1e-9]));
  return arr.map(function(a){
    return '<div class="brow2"><span class="nm">'+esc(a.label)+'</span><span class="tr"><i style="width:'+(a.value/max*100)+'%"></i></span><span class="vl num">'+short(a.value)+'</span></div>';
  }).join('');
}
function drawDonut(arr){
  var tot=arr.reduce(function(a,x){return a+x.value;},0);
  if(tot<=0) return '<div class="empty">Sin datos en este periodo.</div>';
  var R=54,C=2*Math.PI*R,off=0;
  var segs=arr.map(function(x,i){
    var len=C*x.value/tot,s='<circle r="'+R+'" cx="80" cy="80" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="26" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)"/>';
    off+=len;return s;
  }).join('');
  var leg=arr.map(function(x,i){
    return '<div><i style="background:'+PAL[i%PAL.length]+'"></i><span>'+esc(x.label)+'</span><b class="num">'+short(x.value)+'</b><span style="flex:none;color:var(--mute)">'+Math.round(x.value/tot*100)+'%</span></div>';
  }).join('');
  return '<svg class="ch" viewBox="0 0 160 160" style="max-width:190px;margin:0 auto">'+segs+'<text x="80" y="84" text-anchor="middle" style="font:600 15px var(--serif);fill:var(--ink)">'+short(tot)+'</text></svg><div class="legend">'+leg+'</div>';
}
function drawSeries(arr,type,ref){
  var W=340,H=190,L=40,R=8,T=14,B=26,iw=W-L-R,ih=H-T-B;
  var max=niceMax(Math.max.apply(null,arr.map(function(a){return a.value;}).concat([ref||0,1e-9])));
  var y=function(v){return T+ih-v/max*ih;};
  var out='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">';
  for(var g=0;g<=3;g++){
    var gy=T+ih-ih*g/3;
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(gy+4)+'" text-anchor="end">'+short(max*g/3)+'</text>';
  }
  var n=arr.length, step=Math.ceil(n/7);
  if(type==='col'){
    var slot=iw/n,bw=Math.min(28,slot*0.7);
    arr.forEach(function(a,i){
      var cx=L+(i+0.5)*slot,h=a.value/max*ih;
      out+='<rect x="'+(cx-bw/2)+'" y="'+(T+ih-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="var(--blue)"/>';
      if(i%step===0) out+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(a.label)+'</text>';
    });
  }else{
    var X=function(i){return n===1?L+iw/2:L+i*iw/(n-1);};
    var pts=arr.map(function(a,i){return X(i)+','+y(a.value);}).join(' ');
    out+='<polygon points="'+X(0)+','+(T+ih)+' '+pts+' '+X(n-1)+','+(T+ih)+'" fill="var(--blue)" opacity=".12"/>';
    out+='<polyline points="'+pts+'" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    arr.forEach(function(a,i){if(i%step===0) out+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(a.label)+'</text>';});
    if(n>0) out+='<circle cx="'+X(n-1)+'" cy="'+y(arr[n-1].value)+'" r="3.5" fill="var(--blue)"/>';
  }
  if(ref>0){
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(ref)+'" y2="'+y(ref)+'" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(y(ref)-4)+'" text-anchor="end" style="fill:var(--warn)">Meta</text>';
  }
  return out+'</svg>';
}

function roundStep(v,cur){var st=cur==='USD'?10:5000;return Math.max(st,Math.ceil(v/st)*st);}
function suggestions(m){
  var nm=addMonths(m,1), st=monthStats(m), out=[];
  S.cats.filter(function(c){return c.kind==='variable';}).forEach(function(c){
    var spentCRC=st.exb.filter(function(e){return e.cat===c.id;}).reduce(function(a,e){return a+crcOf(e);},0);
    var b=budgetEntry(nm,c.id), bCRC=b.cur==='USD'?b.amt*rate():b.amt;
    if(spentCRC<=0) return;
    var n=null, why='';
    if(bCRC>0&&spentCRC>bCRC*1.1){n=spentCRC;why='Gastaste '+money(spentCRC,'CRC')+'. Subí la meta o recortá ese gasto.';}
    else if(c.id!=='imprev'&&bCRC>0&&spentCRC<bCRC*0.6&&bCRC-spentCRC>=10000){n=Math.max(spentCRC*1.15,bCRC*0.75);why='Gastaste '+money(spentCRC,'CRC')+', te sobró bastante. Bajarla de a poco.';}
    else if(bCRC<=0&&spentCRC>0){n=spentCRC;why='No tenía meta y gastaste '+money(spentCRC,'CRC')+'.';}
    if(n==null) return;
    var amt=b.cur==='USD'?roundStep(n/rate(),'USD'):roundStep(n,'CRC');
    if(Math.abs(amt-b.amt)<(b.cur==='USD'?10:5000)) return;
    out.push({c:c,from:b,to:{amt:amt,cur:b.cur},why:why,up:amt>b.amt});
  });
  return out;
}

    +'<div class="kv"><span>Ahorro</span><b class="num">'+money(crcToDisp(saved))+' de '+money(crcToDisp(plan))+'</b></div>';
  if(sg.length){
    h+='<h2 style="font-size:16px;margin:14px 0 4px">Sugerencias para '+monthLabel(nm).toLowerCase()+'</h2>'
      +'<p class="hint" style="margin:0 0 4px">Marcá las que querés aplicar.</p>'

  }else h+='<p class="hint" style="margin-top:10px">Tus metas para '+monthLabel(nm).toLowerCase()+' calzan con lo que gastaste. No hay ajustes sugeridos.</p>';
  return h+'</section>';
}

function viewYear(){

  for(var i=1;i<=12;i++){

/* app instalada en iPhone: iOS 26 deja una franja abajo, fuera de la ventana. Se pinta del color de la barra
   (fondo de html) y se descuenta del margen inferior para que la barra y los botones no queden más altos. */
function fitApp(){
  var gap=0;
  if(navigator.standalone){
    var portrait=window.innerWidth<window.innerHeight, g=(portrait?screen.height:screen.width)-window.innerHeight;
    if(g>=120) return; // teclado abierto: no tocar
    if(g>0) gap=g;
  }
  document.documentElement.style.setProperty('--gap',gap+'px');
}

    +'<button class="btn primary" style="width:100%" data-act="fx-refresh">Actualizar en vivo</button>'
    +'<label class="l">O fijalo vos (colones por dólar)</label><div class="two" style="grid-template-columns:1fr auto"><input id="fx_in" type="number" inputmode="decimal" step="any" value="'+f.rate+'"><button class="btn" data-act="fx-manual">Fijar</button></div>'
    +(f.manual?'<button class="btn ghost" data-act="fx-auto">Volver a automático</button>':'')
    +'<p class="hint" style="margin-top:12px">Cada gasto guarda el tipo de cambio del momento en que lo registrás, así tu historial no cambia cuando el dólar se mueve.</p>'
    +'<div class="btns"><button class="btn" data-act="cancel">Cerrar</button></div>';
  openSheet(html);
}

/* ================= acciones ================= */
function setPath(path,val){
  var p=path.split('.'), o=U();
  for(var i=0;i<p.length-1;i++) o=o[p[i]];
  o[p[p.length-1]]=val;
  if(path==='chart.period'&&val!=='month'&&U().chart.group==='day') U().chart.group='week';
  fixChart(); save(); render();
}
function setBudget(cid,amt,cur){
  var m=U().month, o={amt:Math.max(0,amt||0),cur:cur};
  if(U().scope==='month'){S.budgets.over[m]=S.budgets.over[m]||{};S.budgets.over[m][cid]=o;}
  else S.budgets.base[cid]=o;
  save();render();
}
function downloadFile(data,name,cb){
  var blob=new Blob([data],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000); if(cb) cb();
}
function doExport(){
  var name='gastos-respaldo-'+ymd(new Date())+'.json';
  var prevLB=S.settings.lastBackup; S.settings.lastBackup=Date.now();
  var data=JSON.stringify(S,null,2);
  var done=function(){save();render();toast('Respaldo guardado');};
  var fail=function(){S.settings.lastBackup=prevLB;};
  try{
    if(typeof File!=='undefined'&&navigator.canShare){
      var file=new File([data],name,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Respaldo de Mis gastos'}).then(done).catch(function(err){if(err&&err.name==='AbortError'){fail();return;}downloadFile(data,name,done);});
        return;
      }
    }
  }catch(e){}
  downloadFile(data,name,done);
}
function act(name,el){
  var d=el.dataset, m;
  switch(name){
    case 'tab': U().tab=d.v; save(); render(); scrollTop0(); break;
    case 'disp': S.settings.disp=d.v; save(); render(); break;
    case 'mprev': U().month=addMonths(U().month,-1); save(); render(); break;
    case 'mnext': U().month=addMonths(U().month,1); save(); render(); break;
    case 'fx': fxSheet(); break;
    case 'fx-refresh': toast('Actualizando…'); fetchFx(true).then(function(ok){toast(ok?'Tipo de cambio actualizado':'No se pudo actualizar. Revisá tu conexión.'); if(ok) fxSheet();}); break;
    case 'fx-manual': var v=parseFloat($('#fx_in').value); if(v>100&&v<2000){S.fx={rate:round2(v),ts:Date.now(),manual:true,est:false};save();closeSheet();render();toast('Tipo de cambio fijado');}else toast('Ingresá un valor entre 100 y 2000'); break;
    case 'fx-auto': S.fx.manual=false; save(); closeSheet(); fetchFx(true); render(); break;
    case 'ovl': closeSheet(); break;
    case 'cancel': closeSheet(); break;
    case 'add-exp': expSheet(); break;
    case 'edit-exp': expSheet(d.id); break;
    case 'cur': $('#f_cur').value=d.v; $$('.seg button[data-act="cur"]').forEach(function(b){b.classList.toggle('on',b===el);}); updatePrev(); break;
    case 'via': setVia(d.v); break;
    case 'use-card': setCardPick(d.id); sheetState.cardTouched=true; updatePrev(); break;
    case 'pick-card': setCardPick(d.id); sheetState.cardTouched=true; updatePrev(); break;
    case 'pick-merch':
      $('#f_merchant').value=d.n; $$('#f_mchips button').forEach(function(b){b.classList.toggle('on',b===el);});
      var pf=merchantProfile(d.n); if(pf&&!sheetState.id){var ct=sheetState.catTouched;sheetState.catTouched=true;applyProfile(pf,false);sheetState.catTouched=ct;} else autoCard(false);
      updatePrev(); break;
    case 'edit-merch': merchSheet(d.id); break;
    case 'add-merch': merchSheet(); break;
    case 'bal-sheet': balSheet(); break;
    case 'save-bal':
      S.cards.forEach(function(c){var el=$('#b_c_'+c.id);if(!el)return;var v=num(el.value);if(!isNaN(v))c.startBal=v-(cardEarned(c).units-cardRedeemed(c));});
      S.goals.forEach(function(g){var el=$('#b_g_'+g.id);if(!el)return;var v=num(el.value);if(!isNaN(v))g.initial=v-(S.contribs.filter(function(c){return c.goal===g.id;}).reduce(function(a,c){return a+c.amt;},0)-goalUsed(g));});
      S.settings.balDone=true; save(); closeSheet(); render(); toast('Saldos guardados'); break;
    case 'save-merch':
      var mn=$('#mm_name').value.trim(); if(!mn){toast('Poné un nombre');break;}
      var dup=merchByName(mn); if(dup&&dup.id!==sheetState.id){toast('Ese comercio ya existe');break;}
      var mo={name:mn,cat:$('#mm_cat').value,site:$('#mm_site').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'')}; if(sheetState.photo!==undefined) mo.img=sheetState.photo;
      if(sheetState.id){var old=S.merchants.find(function(x){return x.id===sheetState.id;});if(old.name!==mn)S.expenses.forEach(function(e){if(e.merchant===old.name)e.merchant=mn;});Object.assign(old,mo);}
      else S.merchants.push(Object.assign({id:'m_'+uid(),img:''},mo));
      save(); closeSheet(); render(); toast('Comercio guardado'); break;
    case 'del-merch': if(confirm('¿Eliminar este comercio de la lista? Tus gastos se conservan.')){S.merchants=S.merchants.filter(function(x){return x.id!==sheetState.id;});save();closeSheet();render();} break;
    case 'mm-photo-del': sheetState.photo=''; $('#mm_prev').innerHTML=merchMini($('#mm_name').value||'?'); break;
    case 'quick': var q=sheetState.quick&&sheetState.quick[+d.i]; if(q){$('#f_merchant').value=q.e.merchant;sheetState.catTouched=false;sheetState.cardTouched=false;sheetState.intlTouched=false;applyProfile(q.e,true);var fa=$('#f_amt');if(fa){fa.focus();fa.select&&fa.select();}} break;
    case 'home': U().home=d.v; save(); render(); break;
    case 'goto-close': U().seen[d.v]=true; U().month=d.v; U().home='month'; save(); render(); scrollTop0(); break;
    case 'goto-month': U().month=d.v; U().home='month'; save(); render(); scrollTop0(); break;
    case 'dismiss': U().dismiss[d.v]=Date.now()+7*864e5; save(); render(); break;
    case 'apply-sugg':
      var nm2=addMonths(d.v,1), pick={}; $$('.sgc').forEach(function(cb){if(cb.checked)pick[cb.dataset.cid]=1;});
      var sg=suggestions(d.v).filter(function(x){return pick[x.c.id];});
      if(!sg.length){toast('Marcá al menos una sugerencia');break;}
      S.budgets.over[nm2]=S.budgets.over[nm2]||{};
      sg.forEach(function(x){S.budgets.over[nm2][x.c.id]={amt:x.to.amt,cur:x.to.cur};});
      U().seen[d.v]=true; save(); render(); toast(sg.length+' metas ajustadas en '+monthLabel(nm2).toLowerCase()); break;
    case 'add-redeem': redeemSheet(d.id); break;
    case 'save-redeem':
      var da=num($('#d_amt').value); if(!(da>0)){toast('Ingresá una cantidad');break;}
      S.redeems.push({id:uid(),card:$('#d_card').value,date:$('#d_date').value||ymd(new Date()),amt:round2(da),note:$('#d_note').value.trim()});
      save(); closeSheet(); render(); toast('Canje registrado'); break;
    case 'del-redeem': if(confirm('¿Borrar este canje?')){S.redeems=S.redeems.filter(function(r){return r.id!==d.id;});save();render();} break;
    case 'k-photo-reset': sheetState.photo=defaultImg(sheetState.id); var cc=Object.assign({},cardById(sheetState.id),{img:sheetState.photo}); $('#k_prev').innerHTML=cardBig(cc); break;
    case 'save-exp': saveExp(); break;
    case 'del-exp': if(confirm('¿Eliminar este gasto?')){S.expenses=S.expenses.filter(function(e){return e.id!==sheetState.id;});save();closeSheet();toast('Gasto eliminado');render();} break;
    case 'pay-fixed': expSheet(null,d.id,d.per); break;
    case 'cat-go': U().fcat=d.id; U().tab='exp'; save(); render(); scrollTop0(); break;
    case 'scope': U().scope=d.v; save(); render(); break;
    case 'clear-over': delete S.budgets.over[U().month]; save(); render(); toast('Ajustes del mes quitados'); break;
    case 'add-cat': catSheet(); break;
    case 'save-cat':
      var nm=$('#n_name').value.trim(); if(!nm){toast('Poné un nombre');break;}
      var cid='c_'+uid(); S.cats.push({id:cid,name:nm,emoji:$('#n_emoji').value||'🏷️',group:$('#n_group').value,kind:$('#n_kind').value});
      S.budgets.base[cid]={amt:0,cur:'CRC'}; save(); closeSheet(); render(); toast('Categoría agregada'); break;
    case 'add-recur': recurSheet(); break;
    case 'edit-recur': recurSheet(d.id); break;
    case 'save-recur':
      var rn=$('#r_name').value.trim(), ra=num($('#r_amt').value);
      if(!rn||!(ra>=0)){toast('Completá nombre y monto');break;}
      var ro={name:rn,amt:ra,fee:num($('#r_fee').value)||0,cur:$('#r_cur').value,cat:$('#r_cat').value,card:$('#r_card').value,merchant:$('#r_merchant').value.trim()||rn,day:Math.max(1,Math.min(31,parseInt($('#r_day').value)||1)),fixed:$('#r_fixed').checked,auto:$('#r_auto').checked,intl:$('#r_intl').checked,active:$('#r_active').checked};
      if(sheetState.id) Object.assign(S.recurring.find(function(x){return x.id===sheetState.id;}),ro); else S.recurring.push(Object.assign({id:'r_'+uid()},ro));
      save(); closeSheet(); render(); toast('Fijo guardado'); break;
    case 'del-recur': if(confirm('¿Eliminar este fijo? Los gastos ya registrados se conservan.')){S.recurring=S.recurring.filter(function(x){return x.id!==sheetState.id;});save();closeSheet();render();} break;
    case 'add-contrib': contribSheet(d.id); break;
    case 'save-contrib':
      var ca=num($('#c_amt').value); if(!(ca>0)){toast('Ingresá un monto');break;}
      var cd=$('#c_date').value; if(!cd){toast('Elegí una fecha');break;}
      S.contribs.push({id:uid(),goal:$('#c_goal').value,date:cd,amt:round2(ca),note:$('#c_note').value.trim()});
      if(cd.slice(0,7)!==U().month) U().month=cd.slice(0,7);
      save(); closeSheet(); render(); toast('Aporte guardado'); break;
    case 'del-contrib': if(confirm('¿Borrar este aporte?')){S.contribs=S.contribs.filter(function(c){return c.id!==d.id;});save();render();} break;
    case 'add-goal': goalSheet(); break;
    case 'edit-goal': goalSheet(d.id); break;
    case 'save-goal':
      var gn=$('#g_name').value.trim(); if(!gn){toast('Poné un nombre');break;}
      var go={name:gn,monthly:num($('#g_monthly').value)||0,target:num($('#g_target').value)||0,from:$('#g_from').value,to:$('#g_to').value,initial:num($('#g_init').value)||0};
      if(sheetState.id) Object.assign(goalById(sheetState.id),go); else S.goals.push(Object.assign({id:'g_'+uid(),color:PAL[S.goals.length%PAL.length]},go));
      save(); closeSheet(); render(); toast('Meta guardada'); break;
    case 'del-goal': if(confirm('¿Eliminar esta meta y sus aportes?')){var gid=sheetState.id;S.goals=S.goals.filter(function(g){return g.id!==gid;});S.contribs=S.contribs.filter(function(c){return c.goal!==gid;});save();closeSheet();render();} break;
    case 'edit-card': cardSheet(d.id); break;
    case 'add-card': cardSheet(); break;
    case 'save-card': saveCard(); break;
    case 'del-card':
      if(S.expenses.some(function(e){return e.card===sheetState.id;})){toast('Tiene gastos registrados. Ocultala en lugar de eliminarla.');break;}
      if(confirm('¿Eliminar esta tarjeta?')){S.cards=S.cards.filter(function(c){return c.id!==sheetState.id;});save();closeSheet();render();} break;
    case 'chart': U().chart[d.k]=d.v; fixChart(); save(); render(); break;
    case 'export': doExport(); break;
    case 'import-click': $('#impfile').click(); break;
    case 'reset': if(confirm('Esto borra todos tus gastos, metas y ajustes de este dispositivo. ¿Continuar?')){try{localStorage.removeItem(KEY);}catch(e){}S=seed();RW=null;render();toast('Datos borrados');} break;
  }
}

/* ================= eventos ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='ovl'&&e.target!==el) return;
  act(el.dataset.act,el);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.set){
    var v=t.type==='checkbox'?t.checked:t.value;
    setPath(t.dataset.set,v);
    return;
  }
  var row=t.closest&&t.closest('.brow[data-cid]');
  if(row){setBudget(row.dataset.cid,num($('.bamt',row).value),$('.bcur',row).value);return;}
  if(t.id==='s_income'){S.settings.income=t.value===''?null:num(t.value);save();toast('Guardado');return;}
  if(t.id==='s_mile'){S.settings.mileUSD=parseFloat(t.value)||0.01;save();toast('Guardado');return;}
  if(t.id==='s_start'){S.settings.start=t.value;save();toast('Guardado');return;}
  if(t.id==='k_photo'&&t.files&&t.files[0]){loadPhoto(t.files[0]);t.value='';return;}
  if(t.id==='mm_photo'&&t.files&&t.files[0]){loadMerchPhoto(t.files[0]);t.value='';return;}
  if(t.id==='f_merchant'&&!sheetState.id&&!sheetState.recurId){var pr=merchantProfile(t.value);if(pr)applyProfile(pr,false);return;}
  if(t.id==='f_goal'){updatePrev();return;}
  if(t.id==='f_reimb'){$('#f_rbox').style.display=t.checked?'block':'none';return;}
  if(t.id==='impfile'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var p=JSON.parse(fr.result);
        if(!p||!Array.isArray(p.expenses)||!Array.isArray(p.cards)) throw new Error('formato');
        if(!confirm('Esto reemplaza los datos actuales de este dispositivo. ¿Importar?')) return;
        S=Object.assign(seed(),p); RW=null; save(); render(); toast('Respaldo importado');
      }catch(err){toast('El archivo no parece un respaldo válido');}
    };
    fr.readAsText(t.files[0]); t.value='';
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){qSearch=t.value;var l=$('#explist');if(l) l.innerHTML=expListHTML();return;}
  if(t.closest&&t.closest('#xf')){
    if(t.id==='f_merchant'){var mc2=$('#f_mchips');if(mc2)$$('button',mc2).forEach(function(b){b.classList.toggle('on',b.dataset.n.toLowerCase()===t.value.trim().toLowerCase());});}
    if(t.id==='f_merchant'&&!sheetState.id&&!sheetState.recurId){var pr2=merchantProfile(t.value);if(pr2){applyProfile(pr2,false);return;}}
    if(t.id==='f_cat'){
      sheetState.catTouched=true;
      var mc=$('#f_mchips'); if(mc) mc.innerHTML=merchChipsHTML(t.value,$('#f_merchant').value);
      var ml=$('#mlist'); if(ml) ml.innerHTML=merchOptions(t.value);
      var c=catById(t.value);
      if(!sheetState.intlTouched) $('#f_intl').checked=!!(c&&c.defIntl);
      syncViaBox();
      autoCard(false);
    }
    if(t.id==='f_intl'){sheetState.intlTouched=true;autoCard(false);}
    if(t.id==='f_amt'||t.id==='f_rate') autoCard(false);
    updatePrev();
  }
});

document.addEventListener('focusout',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.money&&t.value!=='')t.value=fmtIn(t.value);});
document.addEventListener('toggle',function(e){
  var t=e.target; if(!t.dataset||!t.dataset.fold) return;
  U()['fold_'+t.dataset.fold]=t.open; save();
  var sm=t.querySelector('summary'); if(t.dataset.fold==='flt'&&sm) sm.textContent=t.open?'Ocultar filtros':'Periodo y filtros';
},true);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&!S.fx.manual&&Date.now()-S.fx.ts>6*3600e3) fetchFx(false);
});

/* el botón + se esconde al bajar y vuelve al subir */
(function(){
  var v=document.getElementById('view'),last=0;
  v.addEventListener('scroll',function(){
    var y=v.scrollTop,f=document.getElementById('fab');
    if(y>last+8&&y>90) f.classList.add('away'); else if(y<last-8||y<90) f.classList.remove('away');
    last=y;
  },{passive:true});
})();

/* ================= arranque ================= */
render();
if(!S.fx.manual&&(!S.fx.ts||Date.now()-S.fx.ts>6*3600e3)) fetchFx(false);

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist().catch(function(){});}catch(e){}}

/* para pruebas */
window.__app={get S(){return S;},render:render,rewards:rewards,monthStats:monthStats,act:act};
})();
</script>
