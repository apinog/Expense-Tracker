<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expense-Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Expense-Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236C5CE7'/%3E%3Cpath d='M14 44l12-14 10 8 14-18' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F44; --blue:#0057A8; --sky:#7FB4EA; --tint:#EAF1FA;
  --bg:#FAFBFC; --panel:#FFFFFF; --ink:#14181F; --ink2:#454C59; --mute:#757D8A; --line:#E1E5EC;
  --ok:#00796B; --warn:#B7791F; --bad:#B3261E; --gold:#B7791F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sabx:max(0px,calc(var(--sab) - var(--gap,0px)));
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D1117; --panel:#151A23; --ink:#EEF1F6; --ink2:#B7BDC9; --mute:#8993A3; --line:#252C38; --tint:#16233B; --blue:#4C9BEA; --ok:#2FB59F; --warn:#E0A53B; --bad:#F2706A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.in{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums lining-nums}

/* barra superior */
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 0}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:600 17px var(--serif);letter-spacing:.2px}
.tright{display:flex;align-items:center;gap:8px}
.fxchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px}
.fxchip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:13px}
.seg button.on{background:var(--blue);color:#fff}
.seg.mini{background:rgba(255,255,255,.12)}
.seg.mini button{color:#fff;padding:4px 11px;font-size:13px}
.seg.mini button.on{background:#fff;color:var(--navy)}
.mrow{display:flex;align-items:center;gap:4px;margin:6px -8px 0}
.mnav{width:44px;height:40px;border:0;background:transparent;color:#fff;font-size:26px;line-height:1}
.msel{flex:1;appearance:none;-webkit-appearance:none;background:transparent;border:0;color:#fff;font:600 16px var(--serif);text-align:center;text-align-last:center;padding:8px 0}
.msel option{color:#000}

/* contenido */
#view{padding-bottom:calc(96px + var(--sab))}
.hero{background:var(--navy);color:#fff;padding:6px 16px 20px}
.hero .lbl{color:#B9C6DD;font-size:13px}
.hero .big{font:500 44px/1.05 var(--serif);margin:4px 0 4px}
.hero .bar{background:rgba(255,255,255,.18)}
.hero .bar .pace{background:#fff;opacity:.95}
.hstats{display:flex;margin-top:16px;border-top:1px solid rgba(255,255,255,.16);padding-top:12px}
.hstats div{flex:1;min-width:0}
.hstats div+div{border-left:1px solid rgba(255,255,255,.16);padding-left:12px}
.hstats small{display:block;color:#B9C6DD;font-size:11.5px}
.hstats b{font:500 15px var(--serif)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px 12px}
.tile .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .tn{font-size:13.5px;font-weight:500;line-height:1.25;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tile .tt>svg{flex:none;margin:-3px -4px 0 0}
.tile .ta{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ta b{color:var(--ink);font-weight:600}
.tile .ts{font-size:12.5px;font-weight:500}
.fixrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.fixrow:last-child{border-bottom:0}
.fixrow .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:#fff}
.fixrow .dot.done{background:var(--ok);border-color:var(--ok)}
.fixrow .nm{flex:1;min-width:0}
.fixrow .nm small{display:block;color:var(--mute);font-size:12px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.shead span{color:var(--mute);font-size:13px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:600 19px/1.2 var(--serif)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'+';font:400 22px var(--sans);color:var(--mute)}
details.fold[open]>summary::after{content:'−'}
details.fold[open]>summary{margin-bottom:10px}
details.more>summary{cursor:pointer;color:var(--blue);font-size:13px;list-style:none;margin:2px 0 8px}
details.more>summary::-webkit-details-marker{display:none}
.hero .sub{color:#D6E0F0;font-size:13px}
.hero .sub b{color:#fff}
.hero .sub b.bad{color:#FFB4AE}
.kpis{display:flex;gap:18px;margin-top:14px}
.kpis div{flex:1}
.kpis small{display:block;color:#B9C6DD;font-size:12px}
.kpis b{font:500 17px var(--serif)}
.sec{padding:18px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.sec:nth-child(even){background:var(--bg)}
.sec h2{font:600 19px/1.2 var(--serif);margin:0 0 4px}
.sec .hint,.sheet .hint{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.link{border:0;background:none;color:var(--blue);padding:0;font-size:13px}

/* barras de progreso con marcador de ritmo */
.bar{position:relative;height:9px;background:var(--line);border-radius:5px;margin:7px 0 2px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.bar.warn>i{background:var(--warn)}
.bar.bad>i{background:var(--bad)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.crow{padding:9px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chead em{font-style:normal;color:var(--mute);font-size:12.5px}
.csub{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.ok{color:var(--ok)} .warnc{color:var(--warn)} .badc{color:var(--bad)}

/* ideas automáticas */
.ins{display:flex;gap:10px;padding:10px 0 10px 12px;border-left:3px solid var(--line);margin-bottom:10px}
.ins.ok{border-color:var(--ok)} .ins.warn{border-color:var(--warn)} .ins.bad{border-color:var(--bad)}
.ins b{display:block;font-weight:600}
.ins span{color:var(--ink2)}

/* tabla */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mute);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{white-space:normal}
.tbl tr.sub td{font-weight:600;background:var(--tint)}
.tbl tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}

/* explorador */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.ctl label{display:block;color:var(--mute);font-size:12px;margin-bottom:3px}
.ctl .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.chk input{width:auto;margin:0}
.brow2{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.brow2 .nm{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow2 .tr{flex:1;height:14px;background:var(--tint);border-radius:3px;overflow:hidden}
.brow2 .tr i{display:block;height:100%;background:var(--blue);border-radius:3px}
.brow2 .vl{flex:0 0 auto;min-width:62px;text-align:right}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font:11px var(--sans);fill:var(--mute)}
.empty{color:var(--mute);padding:18px 0;text-align:center}

/* gastos */
.srow{display:flex;gap:8px;padding:14px 16px 8px}
.srow input{flex:1.4}
.srow select{flex:1}
.dayh{display:flex;justify-content:space-between;padding:12px 16px 6px;color:var(--mute);font-size:12.5px;background:var(--bg)}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--line);width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{color:var(--mute);font-size:12px}
.row .amt{text-align:right;flex:none}
.row .amt b{display:block;font-weight:500}
.row .amt small{color:var(--mute);font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;color:#fff;background:var(--c,#7B8794);margin-right:4px}
.rw{color:var(--ok)}
.sumline{padding:4px 16px 8px;color:var(--mute);font-size:12.5px}

/* metas */
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.brow .nm{flex:1;min-width:0}
.brow .nm small{display:block;color:var(--mute);font-size:11.5px}
.brow input{width:104px;text-align:right}
.brow select{width:58px;padding:10px 4px}
.badge{display:inline-block;background:var(--tint);color:var(--blue);border-radius:999px;font-size:11px;padding:0 7px;margin-left:4px}
.kv{display:flex;justify-content:space-between;padding:6px 0}
.kv.t{border-top:1px solid var(--line);font-weight:600;margin-top:4px;padding-top:10px}

/* formularios */
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label.l{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;font-weight:500}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:var(--tint);border-color:transparent;color:var(--blue);width:100%;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}
.prev{background:var(--tint);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.prev .tip{margin-top:6px;color:var(--ink2)}
.prev .tip button{border:0;background:none;color:var(--blue);font-weight:600;padding:0 0 0 6px}

/* hojas */
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet h3{font:600 20px var(--serif);margin:0 0 2px}
.grid-r{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center}
.grid-r label{font-size:13px;color:var(--ink2)}

/* navegación inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:20}
#tabs .in{display:flex}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--mute);background:none;border:0}
#tabs button.on{color:var(--blue);font-weight:600}
#fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + var(--sab));width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;line-height:1;border:0;box-shadow:0 6px 18px rgba(0,87,168,.38);z-index:21}
#fab.hide{display:none}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
/* tarjetas */
.cth{display:inline-block;width:30px;height:19px;border-radius:3px;object-fit:cover;vertical-align:-5px;margin-right:6px;box-shadow:none;background:transparent}
.cth.gen{display:inline-flex;align-items:center;justify-content:center;color:#fff;font:600 8.5px var(--sans);vertical-align:-5px}
.cardimg{width:100%;aspect-ratio:1.586;border-radius:12px;object-fit:cover;display:block;box-shadow:0 8px 20px rgba(11,31,68,.2)}
.cardgen{width:100%;aspect-ratio:1.586;border-radius:12px;flex-direction:column;justify-content:space-between;padding:14px 16px;color:#fff;font:600 18px var(--serif);box-shadow:0 8px 20px rgba(11,31,68,.2)}
.cardgen small{font:500 12px var(--sans);opacity:.85}
.cblock .cardgen{font-size:14px;padding:10px 12px}
.cblock{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cblock:last-child{border-bottom:0}
.cblock h3{font:600 16px var(--sans);margin:0}
.cblock .rules{color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.cblock .kv{padding:3px 0;font-size:13px}
.bankh{font:600 13px var(--sans);color:var(--mute);margin:16px 0 0}
.badge.ok{background:rgba(0,121,107,.12);color:var(--ok)}
.cpick{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.cpick button{flex:none;width:88px;border:2px solid transparent;border-radius:10px;background:none;padding:4px;text-align:center;font-size:11.5px;line-height:1.2;color:var(--ink2);scroll-snap-align:start}
.cpick button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
.cpick .cth{width:76px;height:48px;margin:0 auto 4px;border-radius:6px;display:block;font-size:13px}
.cpick .cth.gen{display:flex}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#fff}
.mi{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;overflow:hidden;flex:none;color:#fff;font:600 9.5px var(--sans);vertical-align:-6px;margin-right:6px;background:#7B8794}
.mi img{width:100%;height:100%;object-fit:cover;background:#fff}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mchips button{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 4px;font-size:13px;color:var(--ink)}
.mchips button.on{border-color:var(--blue);background:var(--tint);font-weight:600}
.qchips{display:flex;gap:6px;overflow-x:auto;margin:8px -16px 0;padding:0 16px 2px}
.qchips button{flex:none;display:flex;align-items:center;border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--ink)}
.banner{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:12px;padding:10px 12px;margin:12px 16px 0}
.banner p{margin:0;flex:1;font-size:13px;color:var(--ink2)}
.banner .x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 2px}
.gear{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.htop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sugg{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.sugg small{display:block;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== estructura de app: nada se pega ni se corre al navegar ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
/* app instalada en iPhone (iOS 26): la raíz mide 100vh para incluir la franja de abajo; lo que se sale de la raíz no se dibuja */
@media (display-mode: standalone){
  @supports (-webkit-touch-callout: none){
    html,body{height:100vh;min-height:100vh}
    #app{bottom:auto;height:100vh}
    .overlay.full{height:100vh}
    :root{--gap:0px !important}
  }
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#top{position:relative;top:auto;flex:none;z-index:5}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:0}
#vin{padding-bottom:calc(92px + var(--sab))}
#tabs{position:relative;left:auto;right:auto;bottom:auto;flex:none;z-index:5}
#fab{transition:transform .2s ease,opacity .2s ease}
#fab.away{transform:translateY(96px);opacity:0;pointer-events:none}
body.noscroll #view{overflow:hidden}
.overlay{inset:auto;left:0;right:0;top:0;bottom:auto;height:100%;overscroll-behavior:contain}
.sheet{max-height:calc(100% - var(--sat) - 8px);display:flex;flex-direction:column;overflow:hidden;padding:0}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 16px 18px}
.sbody:last-child{padding-bottom:calc(18px + var(--sabx))}
.sheet>.btns{flex:none;margin:0;padding:10px 16px calc(12px + var(--sabx));background:var(--panel);border-top:1px solid var(--line)}
.overlay.full .sheet>.btns{padding-bottom:calc(12px + var(--sab))}
.overlay.full .sbody:last-child{padding-bottom:calc(18px + var(--sab))}
button,.seg,.tile,.row,.fixrow,.cpick button,.mchips button,.qchips button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ic{position:relative}
.ic img.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;border-radius:10px}
.mi{position:relative}
.badc{color:var(--bad);font-weight:600}
.ic img.via{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;padding:0;border-radius:5px;border:1.5px solid var(--panel);object-fit:cover;background:#fff}
.mi img.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px;background:#fff}

/* ===== tema fintech (opción C): violeta, tarjetas redondeadas, una sola tipografía ===== */
:root{
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --serif:var(--sans);
  --bg:#F4F5FA; --panel:#FFFFFF; --card2:#F3F4F9; --ink:#12142A; --ink2:#4A4E6B; --mute:#7C809C; --line:#E6E8F0; --tint:#EEEBFF;
  --blue:#6C5CE7; --ok:#00A884; --warn:#D98E04; --bad:#E5484D; --navy:#6C5CE7;
  --hero:#6C5CE7; --hero2:#E4E0FF; --hdr:#6C5CE7; --hdrink:#FFFFFF; --hdrchip:rgba(255,255,255,.16);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E0F1A; --panel:#17192B; --card2:#1F2138; --ink:#FFFFFF; --ink2:#C3C6E0; --mute:#8D90B0; --line:#24273D; --tint:#24214A;
    --blue:#8B7CF6; --ok:#00D2A0; --warn:#FFB547; --bad:#FF6B6B; --navy:#0E0F1A;
    --hero:#6C5CE7; --hero2:#E4E0FF; --hdr:#0E0F1A; --hdrink:#FFFFFF; --hdrchip:#1D1F33;}
}
body{font:14.5px/1.45 var(--sans);letter-spacing:-.005em}
b,strong{font-weight:700}
#top{background:var(--hdr);color:var(--hdrink);padding:calc(8px + var(--sat)) 16px 2px}
.brand{font:800 18px var(--sans);letter-spacing:-.3px}
.fxchip,.gear,.seg.mini{background:var(--hdrchip);color:var(--hdrink)}
.fxchip{font-weight:600}
.seg.mini button{color:var(--hdrink);font-weight:600}
.seg.mini button.on{background:#fff;color:#4B3FC4}
.mnav,.msel{color:var(--hdrink)}
.msel{font:700 17px var(--sans)}
.hero{background:var(--hero);color:#fff;margin:10px 16px 2px;border-radius:24px;padding:16px 16px 14px}
.hero .lbl,.hero .sub,.hstats small,.kpis small{color:var(--hero2)}
.hero .big{font:800 40px/1.05 var(--sans);letter-spacing:-1px}
.hero .sub b{color:#fff}
.hero .bar{background:rgba(255,255,255,.22);height:8px}
.hero .bar>i{background:#fff}
.hero .bar .pace{background:#FFD166;opacity:1;width:3px}
.hstats{border-top:1px solid rgba(255,255,255,.2)}
.hstats div+div{border-left:1px solid rgba(255,255,255,.2)}
.hstats b,.kpis b{font:700 15px var(--sans)}
.hero .seg.mini{background:rgba(255,255,255,.18)}
.sec{margin:12px 16px 0;border-radius:22px;background:var(--panel);border:0;padding:16px}
.sec:nth-child(even){background:var(--panel)}
.sec h2{font:700 18px/1.25 var(--sans);letter-spacing:-.2px}
details.fold>summary{font:700 18px/1.25 var(--sans)}
.tile{background:var(--card2);border:0;border-radius:18px}
.tile .ta b{font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--card2)}
.bar>i{border-radius:999px}
.fixrow{border-bottom-color:var(--line)}
.fixrow .btn.primary,.fixrow .btn.sm{background:var(--tint);border:0;color:var(--blue);border-radius:999px;padding:6px 13px;font-weight:700}
.btn{border-radius:14px;font-weight:600}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:var(--tint);color:var(--blue)}
.banner{background:var(--panel);border-radius:18px;margin:12px 16px 0}
.banner .btn.primary{border-radius:999px;padding:6px 13px}
.seg{border-radius:12px;background:var(--card2)}
.seg button{border-radius:9px;font-weight:600}
input,select,textarea{border-radius:12px;background:var(--card2);border-color:transparent}
.prev{background:var(--card2);border-radius:16px}
.ins{border-left-width:3px;border-radius:0}
.sheet{border-radius:26px 26px 0 0}
.sheet h3{font:800 21px var(--sans);letter-spacing:-.3px}
.row{background:var(--panel)}
.row .ic{border-radius:12px;background:var(--card2)}
.dayh{background:var(--bg)}
.srow{padding-top:12px}
.cblock h3{font:700 16px var(--sans)}
.cardgen{font:700 16px var(--sans)}
.mchips button,.qchips button{background:var(--card2);border-color:transparent}
.mchips button.on{background:var(--tint);border-color:var(--blue)}
#tabs{background:var(--bg);border-top:1px solid var(--line)}
#tabs button.on{color:var(--blue);font-weight:700}
#fab{background:var(--blue);box-shadow:0 8px 22px rgba(108,92,231,.45);border-radius:20px}
#toast{border-radius:14px;font-weight:600}
.cico{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:10px;color:var(--cc);background:color-mix(in srgb,var(--cc) 17%,transparent);vertical-align:middle;margin-right:8px}
.cico svg{width:17px;height:17px}
.cico.sm{width:22px;height:22px;border-radius:7px;margin-right:6px;vertical-align:-6px}
.cico.sm svg{width:14px;height:14px}
.cico.fill{width:100%;height:100%;margin:0;border-radius:12px}
.cico.fill svg{width:19px;height:19px}
.cico.em{background:var(--card2);font-size:15px}
.tile .tn{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:0;-webkit-line-clamp:unset}
.tile .tn>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand{font:800 16.5px var(--sans);letter-spacing:-.4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.trow{gap:8px}
.tright{gap:6px;flex:none}
.fxchip{white-space:nowrap;padding:5px 9px;font-size:11.5px}
.seg.mini button{padding:4px 10px}
.ln{display:flex;align-items:center;gap:8px;min-width:0}
.ln>.mi,.ln>.cico{margin:0;vertical-align:0}
.nm>.ln+small{margin-top:1px}
.sheet .two>div{min-width:0}
.sheet input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=file]):not([type=color]),.sheet select{height:48px;min-height:48px;line-height:1.2}
.sheet input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;width:100%;text-align:left}
.sheet input[type=date]::-webkit-date-and-time-value{text-align:left}
.sheet textarea{height:auto}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mt{background:var(--card2);border-radius:16px;padding:10px 12px;min-width:0}
.mt small{display:block;color:var(--mute);font-size:12px}
.mt b{display:block;font:700 17px var(--sans);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt em{display:block;font-style:normal;color:var(--mute);font-size:12px}
#tabs button{font-size:10.5px}
.cpick{transform:translateZ(0);align-items:flex-start}
.cpick button{transform:translateZ(0)}
.chw{position:relative}
.chw line,.chw text,.chw polyline,.chw polygon,.chw .dot{pointer-events:none}
.ctip{position:absolute;left:0;top:0;display:none;z-index:4;max-width:78%;background:var(--ink);color:var(--bg);font:500 12.5px/1.35 var(--sans);padding:7px 10px;border-radius:12px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ctip.show{display:block}
.ctip b{display:block;font-weight:700}
.chw .dot,.chw .guide{display:none}
.chw .dot.on,.chw .guide.on{display:inline}
.chw.sel rect.cbar{opacity:.4}
.chw.sel rect.cbar.on{opacity:1}
.chw.sel circle.seg{opacity:.45}
.chw.sel circle.seg.on{opacity:1}
.chw.sel .brow2,.chw.sel .legend>div{opacity:.5}
.chw.sel .legend>div.on{opacity:1}
.chw.sel .brow2.on{opacity:1}
.chw [data-tip]{cursor:pointer}
.grp{margin:0 16px;border-radius:18px;overflow:hidden;background:var(--panel)}
.grp .row{border-bottom:1px solid var(--line)}
.grp .row:last-child{border-bottom:0}
.dayh{padding:14px 20px 6px}
.sumline{padding:6px 20px 0}
.srow input,.srow select{min-width:0}
.tile .tn{font-size:13px;letter-spacing:-.15px;hyphens:manual;-webkit-hyphens:manual}
.fixrow .nm{font-size:14px}
.fixrow .nm small{font-size:11.5px;letter-spacing:-.1px}
.ins span{font-size:13.5px;line-height:1.45}
.ins b{font-size:14px}
.cblock .rules{font-size:12px}
</style>
</head>

/* ================= fijos automáticos ================= */
function ensureRecurring(m,force){
  if(!force){
    if(S.generated[m]||m!==ym(new Date())||m<S.settings.start) return 0;
  }
  var n=0, dmax=daysIn(m);
  S.recurring.forEach(function(r){
    if(r.active===false||!billDue(r,m)) return;
    if(S.expenses.some(function(e){return e.recurId===r.id&&mOf(e)===m;})) return;
    S.expenses.push({id:uid(),ts:Date.now(),date:m+'-'+pad(Math.min(r.day||1,dmax)),amt:r.amt,cur:r.cur,rate:rate(),
      cat:r.cat,card:r.card,merchant:r.merchant||r.name,note:'',intl:!!r.intl,recurId:r.id,per:m});
    n++;
  });
  S.generated[m]=true; if(n) save(); return n;
}

function monthDiff(a,b){var p=a.split('-').map(Number),q=b.split('-').map(Number);return (q[0]-p[0])*12+(q[1]-p[1]);}
/* un fijo vence en el mes m si es mensual, o si m cae en su ciclo (cada 3, 6 o 12 meses desde start) */
function billDue(r,m){var ev=r.every||1;if(ev<=1)return true;var d=monthDiff(r.start||m,m);return d>=0&&d%ev===0;}

    var e=S.expenses.find(function(x){return x.recurId===r.id&&mOf(x)===m;});

}
var LEAD=10; // días antes del vencimiento en que aparece la cuota del mes siguiente

/* fijos con cobro automático (Claude, YouTube): se registran solos el día del cobro.
   Solo desde el mes en que se activó (settings.autoFrom); si borrás uno, no vuelve a aparecer (settings.autoDone). */
function autoLogBills(){
  if(window.__noAutoLog) return 0; // las pruebas lo apagan para no depender del día
  var today=ymd(new Date()), cur=ym(new Date()), n=0, done=S.settings.autoDone=S.settings.autoDone||{};
  var first=S.settings.autoFrom||cur;
  S.recurring.forEach(function(r){
    if(r.active===false||!r.auto) return;
    for(var m=first,g=0;m<=cur&&g<24;m=addMonths(m,1),g++){
      if(!billDue(r,m)||!(r.amt>0)) continue;
      var k=r.id+'|'+m; if(done[k]) continue;
      if(S.expenses.some(function(e){return e.recurId===r.id&&mOf(e)===m;})){done[k]=true;continue;}
      var d=dueDate(r,m); if(d>today) continue;
      S.expenses.push({id:uid(),ts:Date.now(),date:d,amt:round2(r.amt+(r.fee||0)),cur:r.cur,rate:rate(),cat:r.cat,card:r.card,merchant:r.merchant||r.name,note:'Logged automatically',intl:!!r.intl,recurId:r.id,per:m,auto:true});
      done[k]=true; n++;
    }
  });
  if(n){save();toast(n===1?'1 bill logged automatically':n+' bills logged automatically');}
  return n;
}
function fixedItems(m){
  var out=fixedStatus(m).map(function(o){o.per=m;return o;}), cur=ym(new Date()), lim=addDays(ymd(new Date()),LEAD), nm=addMonths(m,1);

/* ================= estadísticas del mes ================= */
function reimbGot(e){return e.reimb&&e.reimb.got>0?e.reimb.got:0;}
/* parte propia de un gasto compartido (en la moneda del gasto) y lo que falta que te devuelvan */

function monthIncome(m){

function myShare(e){return e.split&&e.split.mine>=0?Math.min(e.amt,e.split.mine):e.amt;}

function netOf(e){var base=e.split?vOf({amt:myShare(e),cur:e.cur,rate:e.rate}):vOf(e), r=reimbGot(e);return r?base-vOf({amt:r,cur:e.cur,rate:e.rate}):base;}
function monthStats(m){

  var by={}; S.cats.forEach(function(c){by[c.id]={spent:0,budget:budgetDisp(m,c.id),n:0};});

/* ================= ideas automáticas ================= */
function buildInsights(m,st){
  var out=[], cur=ym(new Date()), el=elapsed(m);
  var varCats=S.cats.filter(function(c){return c.kind==='variable';});
  if(!st.ex.length){
    out.push({tone:'',t:'No expenses yet in '+monthLabel(m),x:'Tap + to log the first one. Insights show up once there is activity.'});
    return out;
  }
  if(m===cur&&el>=0.1&&st.budget>0){
    var proj=st.fix+st.varSpent/el, over=proj>st.budget;
    out.push({tone:over?'warn':'ok',t:'Monthly pace',x:'You have spent '+money(st.spent)+'. At this pace you will end near '+money(proj)+', '+(over?money(proj-st.budget)+' over budget.':money(st.budget-proj)+' under budget.')});
  }else if(m<cur&&st.budget>0){
    var d=st.budget-st.spent;
    out.push({tone:d>=0?'ok':'bad',t:'Month close',x:'You ended at '+money(st.spent)+' on a budget of '+money(st.budget)+': '+(d>=0?money(d)+' under.':money(-d)+' over.')});
  }
  var risky=varCats.map(function(c){var o=st.by[c.id];return {c:c,spent:o.spent,budget:o.budget};})
    .filter(function(o){return o.budget>0&&o.spent/o.budget>=0.85;})
    .sort(function(a,b){return b.spent/b.budget-a.spent/a.budget;}).slice(0,2);
  risky.forEach(function(o){
    var p=Math.round(o.spent/o.budget*100), left=daysIn(m)-new Date().getDate();
    out.push({tone:p>100?'bad':'warn',t:o.c.name+' at '+p+'%',x:(p>100?'Already over budget by '+money(o.spent-o.budget)+'.':money(o.budget-o.spent)+' left in the budget')+(m===cur&&p<=100?', with '+left+' days to go.':'.')});
  });
  if(!risky.length&&st.varSpent>0) out.push({tone:'ok',t:'Variable spending on track',x:'No variable category is above 85% of its budget.'});
  var rw=monthRewards(st.ex), credit=0, miss=0, worst=null;
  var rmap=rewards();
  st.ex.forEach(function(e){
    var c=cardById(e.card); if(!c||c.kind!=='credit') return;
    credit+=vOf(e);
    var b=bestCards(e)[0], used=rewardRaw(e,c).crc;
    if(b&&b.crc-used>0.5){var gap=crcToDisp(b.crc-used,e.rate);miss+=gap;if(!worst||gap>worst.gap)worst={gap:gap,e:e,best:b,used:c};}
  });
  if(rw>0&&credit>0) out.push({tone:'ok',t:'Estimated rewards: '+money(rw),x:'About '+(rw/credit*100).toFixed(1)+'% of what you paid with credit cards.'});
  if(worst&&miss>=crcToDisp(500)){
    var ct=catById(worst.e.cat);
    out.push({tone:'warn',t:'You left '+money(miss)+' unearned',x:'The biggest gap was on '+(ct?ct.name.toLowerCase():'a purchase')+': you used '+worst.used.name+' ('+rateText(worst.used,rateFor(worst.used,ct,worst.e.intl))+') and '+worst.best.card.name+' gave '+rateText(worst.best.card,worst.best.rate)+', if the store accepts it.'});
  }
  if(m<cur){
    var pm=addMonths(m,-1), pst=monthStats(pm);
    if(pst.varSpent>0&&st.varSpent>0){
      var ch=(st.varSpent/pst.varSpent-1)*100;
      out.push({tone:ch>5?'warn':'ok',t:'Compared to '+monthLabel(pm),x:'Your variable spending '+(ch>=0?'went up ':'went down ')+Math.abs(Math.round(ch))+'%.'});
    }
  }
  return out.slice(0,5);
}

function niceMax(v){

function drawSeries(arr,type,ref,fmt,refLabel,tipFmt){

/* lista ordenada con distancia del tramo y consumo; una carga cuenta para el consumo solo si ella y la anterior
   fueron a tanque lleno y no faltó registrar ninguna en el medio */
function fuelList(){
  var a=(S.fuel||[]).map(function(f){return Object.assign({},f);}).sort(function(x,y){return x.date<y.date?-1:(x.date>y.date?1:x.odo-y.odo);});
  a.forEach(function(f,i){var p=a[i-1];f.trip=p&&f.odo>p.odo?f.odo-p.odo:0;f.ok=!!(p&&f.trip>0&&f.full!==false&&p.full!==false&&!f.missed);f.l100=f.ok?f.l/f.trip*100:null;});
  return a;
}
function carRange(p){
  var m=U().month, cur=ym(new Date());
  if(p==='year') return [m.slice(0,4)+'-01',m.slice(0,4)+'-12'];
  if(p==='ytd') return [cur.slice(0,4)+'-01',cur];
  if(p==='12m') return [addMonths(cur,-11),cur];
  if(p==='all') return ['0000-00','9999-99'];
  return [m,m];
}
function carStats(list){
  var o={n:list.length,spent:0,l:0,km:0,effL:0,effKm:0,tanks:0,days:0,best:null,worst:null};
  list.forEach(function(f,i){
    o.spent+=f.total; o.l+=f.l;
    if(f.trip>0){o.km+=f.trip;o.tanks++;}
    if(f.ok){o.effL+=f.l;o.effKm+=f.trip;if(!o.best||f.l100<o.best.l100)o.best=f;if(!o.worst||f.l100>o.worst.l100)o.worst=f;}
  });
  o.l100=o.effKm>0?o.effL/o.effKm*100:null; o.kml=o.l100?100/o.l100:null;
  var paid=list.filter(function(f){return f.trip>0;}).reduce(function(a,f){return a+f.total;},0);
  o.ppk=o.km>0?paid/o.km:null; o.ppl=o.l>0?o.spent/o.l:null; o.kmTank=o.tanks?o.km/o.tanks:null;
  if(list.length>1){var d0=new Date(list[0].date+'T12:00'),d1=new Date(list[list.length-1].date+'T12:00');o.days=Math.round((d1-d0)/864e5/(list.length-1));}
  return o;
}
function dec(v,n){return v==null?'—':v.toFixed(n);}
function kmFmt(v){return nfN.format(Math.round(v))+' km';}
function carInsights(all){
  var out=[], today=ymd(new Date()), y=+today.slice(0,4), last=all[all.length-1];
  if(!last) return out;
  // manejo: este año contra el anterior
  var kmDay=function(a,b){var s=all.filter(function(f){return f.date>=a&&f.date<=b;});var km=s.reduce(function(t,f){return t+f.trip;},0);if(!s.length)return null;var first=all.filter(function(f){return f.date<a;}).pop();var start=first?first.date:s[0].date;var days=Math.max(1,(new Date(Math.min(new Date(b+'T12:00'),new Date(last.date+'T12:00')))-new Date(start+'T12:00'))/864e5);return km/days;};
  var now=kmDay(y+'-01-01',y+'-12-31'), prev=kmDay((y-1)+'-01-01',(y-1)+'-12-31');
  if(now&&prev){var ch=Math.round((now/prev-1)*100);out.push({tone:ch<=0?'ok':'warn',t:'You are driving '+Math.abs(ch)+'% '+(ch<=0?'less':'more')+' than in '+(y-1),x:'About '+nfN.format(Math.round(now*30.4))+' km a month this year, versus '+nfN.format(Math.round(prev*30.4))+' in '+(y-1)+'.'});}
  // consumo reciente contra el promedio
  var ok=all.filter(function(f){return f.ok;});
  if(ok.length>=4){
    var avg=ok.reduce(function(a,f){return a+f.l;},0)/ok.reduce(function(a,f){return a+f.trip;},0)*100, r3=ok.slice(-3), rec=r3.reduce(function(a,f){return a+f.l;},0)/r3.reduce(function(a,f){return a+f.trip;},0)*100;
    var same=Math.abs(rec-avg)<0.15;
    out.push({tone:rec<=avg+0.15?'ok':'warn',t:'Last 3 tanks: '+dec(rec,1)+' L/100 km',x:(same?'In line with':(rec<avg?'Better than':'Worse than'))+' your '+dec(avg,1)+' L/100 km average ('+dec(100/rec,1)+' vs '+dec(100/avg,1)+' km/L).'});
  }
  // precio contra hace un año
  var ago=ymd(new Date(Date.now()-365*864e5)), old=null; all.forEach(function(f){if(f.date<=ago)old=f;});
  if(old){var dp=last.ppl-old.ppl;out.push({tone:dp>0?'warn':'ok',t:'Gas is ₡'+nfN.format(Math.round(last.ppl))+' per liter',x:(dp>=0?'₡'+nfN.format(Math.round(dp))+' more':'₡'+nfN.format(Math.round(-dp))+' less')+' than a year ago ('+(dp>=0?'+':'')+Math.round(dp/old.ppl*100)+'%). Official prices: RECOPE.'});}
  // próxima carga
  var lim=ymd(new Date(Date.now()-90*864e5)), rec90=all.filter(function(f){return f.date>=lim&&f.trip>0;});
  if(rec90.length>=2){
    var km90=rec90.reduce(function(a,f){return a+f.trip;},0), first90=all[all.indexOf(rec90[0])-1]||rec90[0];
    var perDay=km90/Math.max(1,(new Date(last.date+'T12:00')-new Date(first90.date+'T12:00'))/864e5), tank=ok.slice(-6).reduce(function(a,f){return a+f.trip;},0)/Math.max(1,ok.slice(-6).length);
    var next=addDays(last.date,Math.round(tank/perDay));
    out.push({tone:'',t:'Next fill-up around '+shortDate(next),x:'You drive about '+Math.round(perDay)+' km a day and a tank lasts you about '+Math.round(tank)+' km.'});
  }
  // presupuesto del mes
  var mm=ym(new Date()), st=monthStats(mm), g=st.by.gasolina;
  if(g&&g.budget>0) out.push({tone:g.spent>g.budget?'bad':'ok',t:money(g.spent)+' of '+money(g.budget)+' gas budget',x:'Logged this month in Expenses.'});
  return out;
}
function carSeries(all,metric,rng){
  var a0=rng[0]==='0000-00'?(all[0]?all[0].date.slice(0,7):ym(new Date())):rng[0], a1=rng[1]==='9999-99'?ym(new Date()):rng[1];
  if(metric==='eff') return all.filter(function(f){return f.ok&&f.date.slice(0,7)>=a0&&f.date.slice(0,7)<=a1;}).map(function(f){return {label:shortDate(f.date),key:f.date,value:f.l100};});
  if(metric==='price') return all.filter(function(f){return f.date.slice(0,7)>=a0&&f.date.slice(0,7)<=a1;}).map(function(f){return {label:shortDate(f.date),key:f.date,value:f.ppl};});
  var out=[], g=0;
  for(var m=a0;m<=a1&&g<60;m=addMonths(m,1),g++){
    var s=all.filter(function(f){return f.date.slice(0,7)===m;});
    out.push({label:mshort(m),key:m,value:metric==='km'?s.reduce(function(a,f){return a+f.trip;},0):crcToDisp(s.reduce(function(a,f){return a+f.total;},0))});
  }
  return out;
}

      +tile('Km per tank',st.kmTank?kmFmt(st.kmTank):'—')+tile('Days between',st.days?st.days+' days':'—')

  var cm=U().carC||'eff', crng=p==='month'?[addMonths(U().month,-11),U().month]:rng, ser=carSeries(all,cm,crng);
  var budget=cm==='spend'?budgetDisp(U().month,'gasolina'):0;

function merchByName(n){var k=String(n||'').trim().toLowerCase();return k?S.merchants.find(function(m){return m.name.trim().toLowerCase()===k;}):null;}
function mImg(m){if(!m||!m.img)return '';var x=/^m:(\w+)$/.exec(m.img);return bu(x?(MIMG[x[1]]||''):m.img);}
function hashColor(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return PAL[Math.abs(h)%PAL.length];}
function favUrl(m){return m&&m.site?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(m.site)+'&sz=128':'';}
function merchMini(name){
  var m=merchByName(name), src=mImg(m), f=favUrl(m);
  if(src) return '<span class="mi"><img src="'+src+'" alt=""></span>';
  return '<span class="mi" style="background:'+hashColor(String(name||'').toLowerCase())+'">'+esc(initials(name))+(f?'<img class="ov" src="'+f+'" alt="" onerror="this.remove()" onload="if(this.naturalWidth<=16)this.remove()">':'')+'</span>';
}
function merchIc(name,fallback){
  var m=merchByName(name), src=mImg(m), f=favUrl(m);
  if(src) return '<img src="'+src+'" alt="">';
  return fallback+(f?'<img class="ov" src="'+f+'" alt="" onerror="this.remove()" onload="if(this.naturalWidth<=16)this.remove()">':'');
}
function merchantsFor(cat){
  var cnt={}, names={};
  S.merchants.forEach(function(m){if(m.cat===cat){var k=m.name.trim().toLowerCase();names[k]=m.name;cnt[k]=cnt[k]||0;}});
  S.expenses.forEach(function(e){
    if(e.cat!==cat||!e.merchant) return;
    var k=e.merchant.trim().toLowerCase(), m=merchByName(e.merchant);
    if(m&&m.cat!==cat) return;
    names[k]=names[k]||e.merchant.trim(); cnt[k]=(cnt[k]||0)+1;
  });
  return Object.keys(names).sort(function(a,b){return cnt[b]-cnt[a];}).map(function(k){return names[k];}).slice(0,14);
}
function merchOptions(cat){return merchantsFor(cat).map(function(n){return '<option value="'+esc(n)+'">';}).join('');}
function merchChipsHTML(cat,sel){
  var l=merchantsFor(cat); if(!l.length) return '';
  var k=String(sel||'').trim().toLowerCase();
  return l.map(function(n){return '<button type="button" data-act="pick-merch" data-n="'+esc(n)+'" class="'+(n.toLowerCase()===k?'on':'')+'">'+merchMini(n)+esc(n)+'</button>';}).join('');
}

/* ================= tarjetas: imágenes ================= */
function initials(n){return String(n||'').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g,' ').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function cardThumb(c){
  if(!c) return '';
  var src=imgSrc(c);
  var gen='<span class="cth gen" style="background:'+c.color+(src?';display:none':'')+'">'+esc(initials(c.name))+'</span>';
  if(!src) return gen;
  return '<img class="cth" src="'+src+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\'">'+gen;
}
function cardBig(c){
  var src=imgSrc(c);
  var gen='<div class="cardgen" style="background:linear-gradient(135deg,'+c.color+',#0B1F44);display:'+(src?'none':'flex')+'"><span>'+esc(c.name)+'</span><small>'+esc(c.bank||'')+'</small></div>';
  if(!src) return gen;
  return '<img class="cardimg" src="'+src+'" alt="'+esc(c.name)+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'+gen;
}
var GSHORT={super:'groceries',salud:'health',clinicas:'clinics',rest:'restaurants',mascotas:'pets',gasolina:'gas',viajes:'travel',entret:'entertainment',tiendas:'stores',intl:'foreign purchases',otros:'everything else'};
function rulesText(c){
  if(c.type==='none') return 'No rewards';
  var by={}; Object.keys(c.rates).forEach(function(k){var r=c.rates[k];if(r>0)(by[r]=by[r]||[]).push(GSHORT[k]||k);});
  return Object.keys(by).map(Number).sort(function(a,b){return b-a;}).slice(0,2).map(function(r){return rateText(c,r)+' on '+by[r].join(', ');}).join('. ');
}
function cardEarned(c,filterFn){
  var rw=rewards(), u=0, crc=0;
  S.expenses.forEach(function(e){
    if(e.card!==c.id||(filterFn&&!filterFn(e))) return; var r=rw.get(e.id); if(!r) return;
    crc+=r.final; u+=c.type==='miles'?r.miles:r.final;
  });
  return {units:u,crc:crc};
}
function cardRedeemed(c){return S.redeems.filter(function(r){return r.card===c.id;}).reduce(function(a,r){return a+r.amt;},0);}
function unitsTxt(c,v){return c.type==='miles'?nfN.format(Math.round(v))+' miles':'₡'+nfN.format(Math.round(v));}
function unitsValueDisp(c,v){return c.type==='miles'?crcToDisp(v*S.settings.mileUSD*rate()):crcToDisp(v);}

/* ================= vistas ================= */
function ring(p,st){
  var R=17,C=2*Math.PI*R,w=Math.max(0,Math.min(100,p));
  var col=st==='bad'?'var(--bad)':(st==='warn'?'var(--warn)':'var(--ok)');
  return '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="5"/>'
    +(w>0?'<circle cx="23" cy="23" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(C*w/100)+' '+C+'" transform="rotate(-90 23 23)"/>':'')
    +'<text x="23" y="27" text-anchor="middle" style="font:600 11px var(--sans);fill:var(--ink)">'+Math.round(p)+'%</text></svg>';
}
function homeSeg(){
  var h=U().home||'month';
  return '<div class="seg mini" style="display:inline-flex"><button data-act="home" data-v="month" class="'+(h==='month'?'on':'')+'">Month</button><button data-act="home" data-v="year" class="'+(h==='year'?'on':'')+'">Year</button></div>';
}
function needBackup(){
  if(!S.expenses.length) return false;
  var lb=S.settings.lastBackup, first=Math.min.apply(null,S.expenses.map(function(e){return e.ts||Date.now();}));
  return lb?Date.now()-lb>7*864e5:Date.now()-first>2*864e5;
}
function daysAgo(ts){var n=Math.floor((Date.now()-ts)/864e5);return n<=0?'today':(n===1?'yesterday':n+' days ago');}
function banners(m){
  var h='', cur=ym(new Date()), pm=addMonths(cur,-1);
  if(!S.settings.balDone&&!(U().dismiss.bal>Date.now())) h+='<div class="banner"><p>Add your current points and savings to keep everything up to date.</p><button class="btn sm primary" data-act="bal-sheet">Add</button><button class="x" data-act="dismiss" data-v="bal" aria-label="Hide">×</button></div>';
  if(needBackup()&&!(U().dismiss.backup>Date.now())) h+='<div class="banner"><p>'+(S.settings.lastBackup?'Your last backup was '+daysAgo(S.settings.lastBackup)+'. Save a new one to iCloud.':'You have not backed up your data yet.')+'</p><button class="btn sm primary" data-act="export">Back up</button><button class="x" data-act="dismiss" data-v="backup" aria-label="Hide">×</button></div>';
  if(m===cur&&new Date().getDate()<=10&&!U().seen[pm]&&S.expenses.some(function(e){return mOf(e)===pm;}))
    h+='<div class="banner"><p>'+monthLabel(pm)+' is closed. See how it went and adjust your budgets.</p><button class="btn sm primary" data-act="goto-close" data-v="'+pm+'">See summary</button></div>';
  return h;
}
function roundStep(v,cur){var st=cur==='USD'?10:5000;return Math.max(st,Math.ceil(v/st)*st);}
function suggestions(m){
  var nm=addMonths(m,1), st=monthStats(m), out=[];
  S.cats.filter(function(c){return c.kind==='variable';}).forEach(function(c){
    var spentCRC=st.exb.filter(function(e){return e.cat===c.id;}).reduce(function(a,e){return a+crcOf(e);},0);
    var b=budgetEntry(nm,c.id), bCRC=b.cur==='USD'?b.amt*rate():b.amt;
    if(spentCRC<=0) return;
    var n=null, why='';
    if(bCRC>0&&spentCRC>bCRC*1.1){n=spentCRC;why='You spent '+money(spentCRC,'CRC')+'. Raise the budget or cut back.';}
    else if(c.id!=='imprev'&&bCRC>0&&spentCRC<bCRC*0.6&&bCRC-spentCRC>=10000){n=Math.max(spentCRC*1.15,bCRC*0.75);why='You spent '+money(spentCRC,'CRC')+' and had plenty left. Lower it gradually.';}
    else if(bCRC<=0&&spentCRC>0){n=spentCRC;why='It had no budget and you spent '+money(spentCRC,'CRC')+'.';}
    if(n==null) return;
    var amt=b.cur==='USD'?roundStep(n/rate(),'USD'):roundStep(n,'CRC');
    if(Math.abs(amt-b.amt)<(b.cur==='USD'?10:5000)) return;
    out.push({c:c,from:b,to:{amt:amt,cur:b.cur},why:why,up:amt>b.amt});
  });
  return out;
}
function closeSection(m){
  var st=monthStats(m); if(!st.ex.length) return '';
  var nm=addMonths(m,1), d=st.budget-st.spent;
  var vr=S.cats.filter(function(c){return c.kind==='variable';}).map(function(c){var o=st.by[c.id];return {c:c,d:o.budget-o.spent,b:o.budget,s:o.spent};}).filter(function(o){return o.b>0;});
  vr.sort(function(a,b){return a.d-b.d;});
  var worst=vr[0], ctl=vr.filter(function(o){return o.s>0&&o.c.id!=='imprev'&&o.d>0;}).sort(function(a,b){return a.s/a.b-b.s/b.b;}), best=ctl[0];
  var saved=S.contribs.filter(function(c){return c.date.slice(0,7)===m;}).reduce(function(a,c){return a+c.amt;},0);
  var plan=S.goals.reduce(function(a,g){return a+goalPlan(g,m);},0);
  var sg=suggestions(m);
  var h='<section class="sec"><h2>'+monthLabel(m)+' summary</h2>'
    +'<div class="kv"><span>Result vs. budget</span><b class="num '+(d<0?'badc':'ok')+'">'+(d>=0?money(d)+' under':money(-d)+' over')+'</b></div>'
    +(worst&&worst.d<0?'<div class="kv"><span>Most over</span><span class="num badc ln">'+catIco(worst.c,'sm')+esc(worst.c.name)+', '+money(-worst.d)+' over</span></div>':'')
    +(best&&best.d>0?'<div class="kv"><span>Best controlled</span><span class="num ok ln">'+catIco(best.c,'sm')+esc(best.c.name)+', '+money(best.d)+' left</span></div>':'')
    +'<div class="kv"><span>Rewards</span><b class="num">'+money(monthRewards(st.ex))+'</b></div>'
    +'<div class="kv"><span>Savings</span><b class="num">'+money(crcToDisp(saved))+' of '+money(crcToDisp(plan))+'</b></div>';
  if(sg.length){
    h+='<h2 style="font-size:16px;margin:14px 0 4px">Suggestions for '+monthLabel(nm)+'</h2>'
      +'<p class="hint" style="margin:0 0 4px">Select the ones you want to apply.</p>'
      +sg.map(function(x){return '<label class="sugg"><input type="checkbox" class="sgc" data-cid="'+x.c.id+'" style="width:auto;margin:3px 0 0"'+(x.up?'':' checked')+'><span style="flex:1"><span class="ln">'+catIco(x.c,'sm')+esc(x.c.name)+'</span><small>'+esc(x.why)+'</small></span><span class="num" style="white-space:nowrap">'+money(x.from.amt,x.from.cur)+' → <b>'+money(x.to.amt,x.to.cur)+'</b></span></label>';}).join('')
      +'<button class="btn ghost" data-act="apply-sugg" data-v="'+m+'">Apply to '+monthLabel(nm)+'</button>';
  }else h+='<p class="hint" style="margin-top:10px">Your budgets for '+monthLabel(nm)+' match what you spent. No suggested changes.</p>';
  return h+'</section>';
}

function viewYear(){
  var y=U().month.slice(0,4), cur=ym(new Date()), start=S.settings.start;
  var last=y<cur.slice(0,4)?y+'-12':(y>cur.slice(0,4)?null:cur);
  var rows=[], tot={s:0,b:0,sv:0,rw:0,g:0}, catT={};
  for(var i=1;i<=12;i++){
    var k=y+'-'+pad(i), st=monthStats(k), active=last&&k<=last&&k>=start;
    var sv=S.contribs.filter(function(c){return c.date.slice(0,7)===k;}).reduce(function(a,c){return a+c.amt;},0);
    var rw=monthRewards(st.ex);
    rows.push({k:k,s:st.spent,b:active?st.budget:0,sv:crcToDisp(sv),rw:rw,active:active||st.ex.length>0});
    tot.s+=st.spent; if(active) tot.b+=st.budget; tot.sv+=crcToDisp(sv); tot.rw+=rw; tot.g+=st.goalSpent;
    st.exb.forEach(function(e){catT[e.cat]=(catT[e.cat]||0)+vOf(e);});
  }
  var d=tot.b-tot.s;
  var h='<div class="hero"><div class="htop"><div class="lbl">Spent in '+y+'</div>'+homeSeg()+'</div>'
    +'<div class="big num">'+money(tot.s)+'</div>'
    +'<div class="sub">'+(tot.b>0?'Budget so far '+money(tot.b)+'. '+(d>=0?money(d)+' under.':money(-d)+' over.'):'No months with a budget yet.')+'</div>'
    +'<div class="hstats"><div><small>Saved</small><b class="num">'+money(tot.sv)+'</b></div><div><small>Rewards</small><b class="num">'+money(tot.rw)+'</b></div><div><small>Paid from savings</small><b class="num">'+money(tot.g)+'</b></div></div></div>';
  h+='<section class="sec"><h2 style="margin-bottom:8px">Spending by month</h2>'+drawSeries(rows.map(function(r){return {label:mshort(r.k),key:r.k,value:r.s};}),'col',0)+'</section>';
  h+='<section class="sec"><h2 style="margin-bottom:8px">Month by month</h2><table class="tbl"><thead><tr><th>Month</th><th>Budget</th><th>Spent</th><th>Saved</th><th>Rewards</th></tr></thead><tbody>'
    +rows.filter(function(r){return r.active;}).map(function(r){return '<tr><td><button class="link" data-act="goto-month" data-v="'+r.k+'">'+monthLabel(r.k).split(' ')[0]+'</button></td><td class="num">'+(r.b?short(r.b):'—')+'</td><td class="num '+(r.b&&r.s>r.b?'badc':'')+'">'+short(r.s)+'</td><td class="num">'+short(r.sv)+'</td><td class="num">'+short(r.rw)+'</td></tr>';}).join('')
    +'<tr class="tot"><td>Total</td><td class="num">'+short(tot.b)+'</td><td class="num">'+short(tot.s)+'</td><td class="num">'+short(tot.sv)+'</td><td class="num">'+short(tot.rw)+'</td></tr></tbody></table></section>';
  var ca=Object.keys(catT).map(function(id){var c=catById(id);return {label:(c?c.name:'Other'),value:catT[id]};}).sort(function(a,b){return b.value-a.value;}).slice(0,8);
  h+='<section class="sec"><h2 style="margin-bottom:8px">Categories this year</h2>'+(ca.length?drawBars(ca):'<div class="empty">No expenses in '+y+'.</div>')+'</section>';
  return h;
}

function viewHome(){
  if((U().home||'month')==='year') return viewYear();
  var m=U().month, st=monthStats(m), el=elapsed(m), cur=ym(new Date());
  var varCats=S.cats.filter(function(c){return c.kind==='variable';});
  var vB=varCats.reduce(function(a,c){return a+(st.by[c.id]?st.by[c.id].budget:0);},0);
  var vS=st.varSpent, left=vB-vS;
  var daysLeft=m===cur?daysIn(m)-new Date().getDate()+1:(m>cur?daysIn(m):0);
  var perDay=daysLeft>0&&left>0?left/daysLeft:null;
  var fx=fixedStatus(m), paid=fx.filter(function(o){return o.e;}).length;
  var rw=monthRewards(st.ex);

  var h='<div class="hero"><div class="htop"><div class="lbl">'+(left>=0?'Available for variable spending':'Over on variable spending')+'</div>'+homeSeg()+'</div>'
    +'<div class="big num">'+money(Math.abs(left))+'</div>'
    +'<div class="sub">You spent '+money(vS)+' of '+money(vB)+'.'+(perDay?' You can spend <b>'+money(perDay)+' a day</b> until month end.':(m<cur?' Month closed.':''))+'</div>'
    +barHTML(vB>0?vS/vB*100:0,el)
    +'<div class="hstats"><div><small>Total spent</small><b class="num">'+money(st.spent)+'</b></div><div><small>Bills paid</small><b class="num">'+paid+' of '+fx.length+'</b></div><div><small>Rewards</small><b class="num">'+money(rw)+'</b></div></div></div>';

  h+=banners(m);
  if(m<cur) h+=closeSection(m);
  var ins=buildInsights(m,st).slice(0,3);
  h+='<section class="sec"><h2 style="margin-bottom:10px">What your numbers say</h2>'+ins.map(function(i){return '<div class="ins '+(i.tone||'')+'"><div><b>'+esc(i.t)+'</b><span>'+esc(i.x)+'</span></div></div>';}).join('')+'</section>';

  var rows=varCats.map(function(c){var o=st.by[c.id]||{spent:0,budget:0};return {c:c,spent:o.spent,budget:o.budget};})
    .filter(function(o){return o.budget>0||o.spent>0;})
    .sort(function(a,b){var pa=a.budget>0?a.spent/a.budget:(a.spent>0?9:0),pb=b.budget>0?b.spent/b.budget:(b.spent>0?9:0);return pb-pa;});
  h+='<section class="sec" style="background:var(--bg)"><h2>Variable spending</h2><p class="hint">Tap a category to see its transactions.</p><div class="tiles">'
    +(rows.length?rows.map(function(o){
      var p=o.budget>0?o.spent/o.budget*100:(o.spent>0?100:0);
      var stt=p>100?'bad':((el>=0.15&&el<1&&p>el*100+15)?'warn':'ok');
      var line=o.budget<=0?'No budget':(p>100?money(o.spent-o.budget)+' over':'Left: '+money(o.budget-o.spent));
      return '<button class="tile" data-act="cat-go" data-id="'+o.c.id+'"><span class="tt"><span class="tn">'+catIco(o.c)+'<span>'+esc(o.c.name)+'</span></span>'+ring(p,stt)+'</span><span class="ta num"><b>'+money(o.spent)+'</b> of '+short(o.budget)+'</span><span class="ts num '+(stt==='bad'?'badc':(stt==='warn'?'warnc':'ok'))+'">'+line+(stt==='warn'?', spending fast':'')+'</span></button>';
    }).join(''):'<div class="empty">Set budgets in the Budget tab.</div>')+'</div></section>';

  if(fx.length){
    var pend=fx.filter(function(o){return !o.e;}).reduce(function(a,o){return a+convAmt(o.r.amt+(o.r.fee||0),o.r.cur);},0);
    h+='<section class="sec"><div class="shead"><h2 style="margin:0">Bills this month</h2><span>'+(paid===fx.length?'All paid':money(pend)+' pending')+'</span></div>'+fixedRows(m,false)+'</section>';
  }

  var pend=S.expenses.filter(function(e){return e.reimb&&!reimbGot(e);});
  if(pend.length){
    var pexp=pend.reduce(function(a,e){return a+(e.reimb.exp>0?vOf({amt:e.reimb.exp,cur:e.cur,rate:e.rate}):0);},0);
    h+='<section class="sec"><div class="shead"><h2 style="margin:0">Pending reimbursements</h2><span>'+(pexp>0?money(pexp)+' to receive':pend.length+' pending')+'</span></div>'
      +pend.map(function(e){var c=catById(e.cat);return '<button class="fixrow" data-act="edit-exp" data-id="'+e.id+'">'+'<span class="nm"><span class="ln">'+merchMini(e.merchant||(c?c.name:'Expense'))+esc(e.merchant||(c?c.name:'Expense'))+'</span><small>'+dayLabel(e.date)+', you paid '+money(vOf(e))+'</small></span><span class="num">'+(e.reimb.exp>0?money(vOf({amt:e.reimb.exp,cur:e.cur,rate:e.rate})):'—')+'</span></button>';}).join('')
      +'<p class="hint" style="margin:8px 0 0">Tap one to log what you got back.</p></section>';
  }
  var mi=monthIncome(m);
  if(mi.total>0){
    var kept=crcToDisp(mi.total)-st.spent, pr=Math.round(kept/crcToDisp(mi.total)*100);
    h+='<section class="sec"><div class="shead"><h2 style="margin:0">Income and savings rate</h2><span>'+(m===cur?'so far':'')+'</span></div>'
      +'<div class="kv"><span>Income</span><b class="num">'+money(crcToDisp(mi.total))+(mi.extra?' <small style="color:var(--mute);font-weight:500">incl. '+money(crcToDisp(mi.extra))+' extra</small>':'')+'</b></div>'
      +'<div class="kv"><span>Spent</span><b class="num">'+money(st.spent)+'</b></div>'
      +'<div class="kv t"><span>Kept</span><b class="num '+(kept<0?'badc':'ok')+'">'+money(kept)+' · '+pr+'%</b></div></section>';
  }
  var owed=S.expenses.filter(function(e){return owedOf(e)>0.5;});
  if(owed.length){
    h+='<section class="sec"><div class="shead"><h2 style="margin:0">Owed to you</h2><span>'+money(owed.reduce(function(a,e){return a+vOf({amt:owedOf(e),cur:e.cur,rate:e.rate});},0))+'</span></div>'
      +owed.map(function(e){var c=catById(e.cat);return '<button class="fixrow" data-act="edit-exp" data-id="'+e.id+'"><span class="nm"><span class="ln">'+merchMini(e.merchant||(c?c.name:'Expense'))+esc(e.merchant||(c?c.name:'Expense'))+'</span><small>'+dayLabel(e.date)+', you paid '+money(vOf(e))+(e.note?' · '+esc(e.note):'')+'</small></span><span class="num">'+money(vOf({amt:owedOf(e),cur:e.cur,rate:e.rate}))+'</span></button>';}).join('')
      +'<p class="hint" style="margin:8px 0 0">Tap one to log what you got back.</p></section>';
  }
  var plan=S.goals.reduce(function(a,g){return a+goalPlan(g,m);},0);
  var done=S.contribs.filter(function(c){return c.date.slice(0,7)===m;}).reduce(function(a,c){return a+c.amt;},0);
  if(plan>0||done>0){
    h+='<section class="sec"><div class="shead"><h2 style="margin:0">Savings this month</h2><button class="link" data-act="tab" data-v="save">See goals</button></div><div class="num">'+money(crcToDisp(done))+' <span style="color:var(--mute)">of '+money(crcToDisp(plan))+' planned</span></div>'
      +'<div class="bar"><i style="width:'+Math.min(100,plan>0?done/plan*100:100)+'%;background:var(--blue)"></i></div></section>';
  }

var WALLET=[['amex clasico economia','amexeco'],['amex clasica blue','amexblue'],['gane premios','gana'],['premia travel','premia'],['cash back','bct']];
function normTxt(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}

function walletCard(name,cur){

  if(/visa debito/.test(k)) return cur==='USD'?'debusd':'debcrc';

/* tarjeta por defecto: la que más usás en esa categoría; si no hay historial, Amex Blue para compras del exterior,

function histCard(cat){
  var lim=ymd(new Date(Date.now()-90*864e5)), n={}, tot=0;
  S.expenses.forEach(function(e){if(e.cat!==cat||e.recurId||e.date<lim||!cardById(e.card))return;n[e.card]=(n[e.card]||0)+1;tot++;});
  var top=Object.keys(n).sort(function(a,b){return n[b]-n[a];})[0];
  return top&&n[top]>=3&&n[top]/tot>=0.6?top:'';
}
function defaultCard(f){
  var ok=function(id){var c=cardById(id);return c&&c.active!==false&&!c.nosug?id:'';};
  var h=ok(histCard(f.cat)); if(h) return h;
  if(f.intl||['online','viajes','suscr'].indexOf(f.cat)>=0) return ok('amexblue')||'';
  return ok('amexeco')||'';
}

function frequentMerchants(){

    var k=e.merchant.trim().toLowerCase(), o=map[k]||(map[k]={n:0,e:e});
    o.n++; if((e.ts||0)>=(o.e.ts||0)) o.e=e;

    if(typeof File!=='undefined'&&navigator.canShare){
      var file=new File([data],name,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Expense-Tracker backup'}).then(done).catch(function(err){if(err&&err.name==='AbortError'){fail();return;}downloadFile(data,name,done);});
        return;
      }
    }
  }catch(e){}
  downloadFile(data,name,done);
}

      var fu=S.fuel.find(function(x){return x.id===sheetState.id;}), uo=num($('#u_odo').value), ul=num($('#u_l').value), up=num($('#u_ppl').value);

    case 'del-fuel': if(confirm('Delete this fill-up from your history?')){S.fuel=S.fuel.filter(function(x){return x.id!==sheetState.id;});save();closeSheet();render();} break;

    case 'export': doExport(); break;

    case 'reset':

      try{localStorage.setItem(KEY,JSON.stringify(pv.data));localStorage.removeItem(PREVKEY);}catch(e){toast('Could not undo');break;}
      S=load();RW=null;render();toast('Done, your previous data is back'); break;
  }
}

function hideTips(except){$$('.chw.sel').forEach(function(w){if(w===except)return;w.classList.remove('sel');$$('.on',w).forEach(function(x){x.classList.remove('on');});var t=$('.ctip',w);if(t)t.classList.remove('show');});}
function showTip(el,e){
  var w=el.closest('.chw'), t=$('.ctip',w), i=el.getAttribute('data-i'); hideTips(w);
  $$('.on',w).forEach(function(x){x.classList.remove('on');});
  $$('[data-i="'+i+'"]',w).forEach(function(x){x.classList.add('on');});
  w.classList.add('sel'); t.innerHTML=el.getAttribute('data-tip'); t.classList.add('show');
  var wr=w.getBoundingClientRect(), tw=t.offsetWidth, th=t.offsetHeight, x=e.clientX-wr.left, y=e.clientY-wr.top;
  t.style.left=Math.max(4,Math.min(wr.width-tw-4,x-tw/2))+'px';
  t.style.top=(y-th-14>=0?y-th-14:Math.min(wr.height-th,y+16))+'px';
}
document.addEventListener('click',function(e){
  var tp=e.target.closest&&e.target.closest('[data-tip]');
  if(tp&&tp.closest('.chw')){showTip(tp,e);return;}
  hideTips(null);
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='ovl'&&e.target!==el) return;
  act(el.dataset.act,el);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.set){
    var v=t.type==='checkbox'?t.checked:t.value;
    setPath(t.dataset.set,v);
    return;
  }
  var row=t.closest&&t.closest('.brow[data-cid]');
  if(row){setBudget(row.dataset.cid,num($('.bamt',row).value),$('.bcur',row).value);return;}
  if(t.id==='s_income'){S.settings.income=t.value===''?null:num(t.value);save();toast('Saved');return;}
  if(t.id==='s_mile'){S.settings.mileUSD=parseFloat(t.value)||0.01;save();toast('Saved');return;}
  if(t.id==='s_start'){S.settings.start=t.value;save();toast('Saved');return;}
  if(t.id==='k_photo'&&t.files&&t.files[0]){loadPhoto(t.files[0]);t.value='';return;}
  if(t.id==='mm_photo'&&t.files&&t.files[0]){loadMerchPhoto(t.files[0]);t.value='';return;}
  if(t.id==='f_merchant'&&!sheetState.id&&!sheetState.recurId){var pr=merchantProfile(t.value);if(pr)applyProfile(pr,false);return;}
  if(t.id==='f_goal'){updatePrev();return;}
  if(t.id==='f_reimb'){$('#f_rbox').style.display=t.checked?'block':'none';return;}
  if(t.id==='f_split'){$('#f_sbox').style.display=t.checked?'block':'none';if(t.checked&&!$('#f_smine').value){var a0=num($('#f_amt').value);if(a0>0)$('#f_smine').value=fmtIn(a0/2);}return;}
  if(t.id==='impfile'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var p=JSON.parse(fr.result);
        if(!p||!Array.isArray(p.expenses)||!Array.isArray(p.cards)) throw new Error('formato');
        if(!confirm('This replaces the current data on this device. Import?')) return;
        if(!keepPrev('import')&&!confirm('There is no room to keep a copy, so you will not be able to undo this. Import anyway?')) return;
        var before=localStorage.getItem(KEY);
        localStorage.setItem(KEY,JSON.stringify(p));
        var n=load();
        if(!n||n.expenses.length!==p.expenses.length){if(before!=null)localStorage.setItem(KEY,before);else localStorage.removeItem(KEY);toast('Could not read the backup. Your data did not change.');return;}
        S=n; RW=null; save(); render(); toast('Backup imported. You can undo it in Settings.');
      }catch(err){toast('That file does not look like a valid backup');}
    };
    fr.readAsText(t.files[0]); t.value='';
  }
});
